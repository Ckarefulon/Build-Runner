                ## 0. 开工第一件事：读规则之源
                仓库根只有一份规则本尊：
                - `DEVELOP.md`：开发规范唯一入口（版本号、分支与发布、提交与 PR、构建与模块边界、凭据）。与本预设冲突时以它为准——**唯一例外是 §4 那句「本地环境 JDK 21、Android SDK 37」**：本机没有 JDK 也没有 SDK，构建不在本机跑，而是走 §4 的云端自检，这一条以本预设为准。

                **注意 `AGENTS.md` 已经不在仓库里了**（2026-11-13 的 `40e593dc` 用 `git rm --cached` 移出索引并加进 `.gitignore`，本地维护）。所以：
                - 不要假设它存在，也不要用 `git show origin/dev:AGENTS.md` 去取——那条路已经断了；
                - 它原文里让代理自己按 `State` 标签领 issue，但在这里**不主动领**：只干维护者当场交代的任务，不改 issue 标签、不自己关 issue，除非他明确说「去领活」或「把标签改成…」。这条是本预设的显式约定，优先级更高。

                ## 1. 这个项目是什么
                面向西安交通大学学生的 Android 校园工具箱（Kotlin + Jetpack Compose + MIUIX），同一份共享代码同时编到 Compose Desktop（`:desktop`）与浏览器 wasmJs（`:web`），另有 serve 模式的 `:server`、只给测试用的假校园上游 `:testkit`。校园账号与数据只在设备与学校系统之间流动，不经过自建中转（唯一例外是小游戏排行榜 `server/leaderboard`）。

                ## 2. 仓库地图：放代码之前先看这一节
                模块清单的真源是 `settings.gradle.kts`（`:shared:*` 5 个、`:feature:*` 15 个），拆分理由与「每个模块该放什么」看 `docs/kmp-module-map.md`。`README.md` 的模块表与它们一致，可以先看。

                依赖方向（只能向下，feature 之间互不依赖）：
                ```
                :shared:model ← :shared:navigation ← :shared:designsystem
                       ↑                ↑
                :shared:network ─────────┘        （Ktor 客户端 createToolboxClient）
                       ↑
                :shared:data  （只有 jvm + android：okhttp / jsoup，没有 wasm 目标）
                :feature:*  →  只依赖 :shared:{model,navigation,designsystem,network}
                :core → 残留壳：只剩 shell/**（10 个文件），用 api 转发全部 shared + feature
                :data → 残留：场馆滑块验证码（Compose 相关）
                :app / :desktop / :web / :server → 平台壳
                ```

                各层职责：
                - `:shared:model`：纯领域模型、`*Source` / `AgentTransport` / `AgentTools` 这类**端口接口**、WebVpn 编解码、Inbox（唯一例外：`InboxStore` 用了 compose-runtime 的 `mutableStateListOf`）。
                - `:shared:designsystem`：MIUIX 主题、玻璃效果、通用组件、`CourseColors`。
                - `:shared:network`：Ktor 客户端、黄页/校历判定等 Api。
                - `:shared:data`：会话内核（CAS 登录 / cookie / 站点快照 / WebVPN）+ 各站取数与解析。
                - `:feature:<功能>`：account agent attendance campus community game home jiaocai library lms notice schedule score settings webvpn。
                - 平台壳：`:app` 宿主（Context / Room / 相机 / BLE / 小组件 / 通知）；`:desktop` 桌面窗口（自己登录，不依赖 serve）；`:web` 浏览器外壳（数据走同源 `/api/*`）；`:server` serve 模式；`:testkit` 假上游（不进任何交付物）。

                **放代码的四条判据**（`docs/kmp-module-map.md` 的「一屏搬进 :core 的规矩」）：
                1. 屏 + 模型 + 取数**端口**（`interface XxxSource`）进 `:feature:*` 或 `:shared:model`；
                2. 平台实现留在平台壳（`:app` / `:desktop`），按端口注入；
                3. Web 侧另写一份 campus-api 版取数实现；
                4. 平台能力（原图查看、设备码登录、扫码…）用 `@Composable` 槽位或带默认实现的接口参数化，`:app` 不实现时行为零变化。
                跨端可移植的判据不是看 import，而是**真编 wasmJs**——那一步只有云端 `core-gate` 会做，所以你在本地要做的是把「一定会让 wasm 编译红」的写法逐个排掉（见 §4.1 第 3 条）。

                ## 3. 红线（碰了就是返工）
                1. `:core`、`:shared:model|navigation|designsystem|network` 的 commonMain 不得出现 `android.*`、`java.*`、只有 JVM 变体的库。CI `core-gate` 用 `:core:compileKotlinWasmJs` / `:web:compileKotlinWasmJs` 拦。隐形 JVM 用法：`String.format`、`toSortedMap`、`java.time`、`Dispatchers.IO`。
                2. `:shared:data` 与 `:data` 刻意只有 jvm + android（okhttp、jsoup 没有 wasm 变体），**不要**给它们加 wasm 目标。
                3. feature 之间不得互相依赖；两处都要用的类型上提到 `:shared:*`。
                4. 不提交构建产物、APK/AAB、`build/`、签名文件、`local.properties`、`feedback.properties`、`leaderboard.properties`（清单见 DEVELOP.md §5）。
                5. 不碰 CI 生成的 Release / tag，不改已发布版本号。
                6. 不提高请求频率、不绕过验证码与访问控制。

                ## 4. 构建与验证：本机没有 JDK/SDK，但**能在云端真跑**，所以「猜能过」不成立
                维护者的实际工况：**打包和装真机是他自己的日常操作，不需要你提醒、也不要写进「待他跑」**。你要负责的是**打包之前那一步**——编译过不过、测试过不过、wasm 门禁过不过。

                **本机的真实状态（逐条复核过）**：没有任何 JDK、没有 Android SDK、没有独立 Gradle、没有 `~/.gradle`。仓库里 `gradlew` / `gradlew.bat` / `gradle-wrapper.jar` **文件确实在**（入库的），但本机**跑不起来**——wrapper 自己也要先找到 JVM。下面全是预期失败，不要在本机重试：

                ```powershell
                # ── 本机（Windows）全部预期失败，不要重试；验证走 §4.0 的云端 Build-Runner ──
                .\gradlew.bat --version
                # ERROR: JAVA_HOME is not set and no 'java' command could be found in your PATH.
                java -version        # 命令不存在（没有 JDK）
                sdkmanager --list    # 命令不存在（没有 Android SDK）
                gradle -v            # 命令不存在（只有 wrapper）
                # adb 在 C:\platform-tools-latest-windows\platform-tools\，但 adb devices 输出为空（没接设备）
                ```

                **但「本机编不了」不等于「没法验证」——云端能编，你必须真跑。见 §4.0。**

                ### 4.0 云端自检：用 Build-Runner 把 GitHub Actions 当构建机
                工具集 `mcp__build-runner__*`（云端 = `Ckarefulon/Build-Runner` 的 `run.yml`，它 checkout **目标仓库**再执行，所以目标仓库零改动）。2026-11-16 已全量实测：

                | 工具 | 用途 |
                |---|---|
                | `doctor` | 先跑这个，token/仓库/workflow/Actions 六项全过再继续 |
                | `run` | 给 `repo`+`ref`+`command`，云端执行并回传 **stdout/stderr + 真实退出码** |
                | `status` | 配合 `wait:false` 轮询；已完成则直接返回完整输出 |
                | `cancel` | 停掉跑飞的任务，省 Actions 时间 |
                | `prepare_workspace` / `workspace_status` / `workspace_reset` | 快照模式：**不提交也能云端构建** |

                **云端已具备的环境（实测，别再重复探测）**：JDK 8/11/17/21/25 全在（默认 17，但本项目不用管，见下）、Android SDK 已到 `android-37.2`（含 `37.0.0` build-tools，够 compileSdk 37）、node 22 + pnpm 12、ubuntu-latest。目标仓库 `yeliqin666/xjtu-toolbox-android` 是 **public**，账号有 push 权限。

                **三条已验证的写法，照抄**：

                ```bash
                # 1) 正常验证：命令里不要自己 export JAVA_HOME。
                #    实测 gradle/gradle-daemon-jvm.properties（toolchainVersion=21）会把 daemon 拉到 JDK 21，
                #    ./gradlew --version 显示 Launcher JVM 17 / Daemon JVM 21，编译正常。
                ./gradlew :app:compileDebugKotlin --console=plain

                # 2) 失败要如实报出来：`set +e` 只让脚本继续执行，结尾必须自己 exit $rc，
                #    否则工具会把失败误报成成功。用 PIPESTATUS 取管道里 gradle 的真实退出码（用 tail 截日志时尤其重要）。
                set +e
                ./gradlew :core:compileKotlinWasmJs --console=plain 2>&1 | tail -20
                rc=${PIPESTATUS[0]}
                echo "== gradle exit: $rc =="
                exit $rc

                # 3) 桌面端离屏布局测试（DesktopShellRailJvmTest 量中文字宽）必须先装 CJK 字体，
                #    否则 137 个测试里会挂 1 个「文字宽度不在 16..70」——不是代码 bug，是 runner 没字库。
                sudo apt-get install -y -q --no-install-recommends fonts-noto-cjk
                fc-list :lang=zh | grep -q . || echo "字体没装上"
                ```

                **`pr-gate.yml` 的完整复刻（已验证 `BUILD SUCCESSFUL`、exit 0，约 8 分钟）**——要一次跑全门禁就用它：

                ```bash
                sudo apt-get install -y -q --no-install-recommends fonts-noto-cjk
                ./gradlew --continue \
                  :app:compileDebugKotlin \
                  jvmTest :server:test :desktop:test \
                  :web:wasmJsBrowserTest --console=plain
                ```

                **快照模式（最有用）**：传 `workspaceDir` 就能拿**未提交的改动**去云端构建，不用为了验证先 commit/push。已实测只传 diff（`base_tree`），快照 commit 的父提交 = 真实基准 `dev` 的 HEAD，所以版本号与 `git describe` 和真提交一致。

                ```jsonc
                {
                  "repo": "yeliqin666/xjtu-toolbox-android",
                  "ref": "dev",
                  "workspaceDir": "<仓库绝对路径>",
                  "command": "set +e; ./gradlew :app:compileDebugKotlin --console=plain 2>&1 | tail -20; rc=${PIPESTATUS[0]}; exit $rc"
                }
                ```

                快照模式注意点：
                - 结果带 `mode: snapshot`——它是**预检**，不等于「已推送代码的构建」。
                - 只上传 **git 能看见**的改动（`.gitignore` 排除的东西永远不出本机）。
                - 会在目标仓库留下/更新一个 `build-runner` 分支；**验完用 `workspace_reset` 清回基准**，别让它堆积。
                - 它签出的是**分支名**而非 SHA（这是历史能对上的关键，工具已处理）。

                成本与节奏：冷启动 25~50 秒；`compileDebugKotlin` 全量约 3 分钟；`pr-gate` 全量约 8 分钟。所以**小改动先只编相关目标**，别一上来就全量；长任务用 `wait:false` + `status` 轮询，不要空转等待。

                ### 4.0.1 什么时候必须跑云端、什么时候不用
                - **必须跑**：改动涉及 `.kt`/`.kts` 编译面、依赖版本、`commonMain`（wasm 门禁）、`desktop`、`server`，或你**没法靠静态检查确定它编得过**。写了 Kotlin 就算——这是本项目最常见的场景。
                - **可以不跑**：纯文档（`docs/**`、`*.md`）、纯注释、`announce` 分支的 `bulletin.json`，以及已用 SearchDeadCode + 读代码完全定论的改动。
                - **跑不了**：需要 keystore/签名口令/OSS 凭据/`FEEDBACK_*` secrets 的完整发版链路（签名版 `assembleRelease`、依赖签名的 `minifyReleaseWithR8` 部分、OSS 上传、Gitee 同步）。这些只有他自己的 CI 能跑，**如实说明你验到哪一步**。
                - **永远不要**：在本机试 gradle；也不要因为跑过云端就宣称真机行为已验证——**运行时/UI/触感/动画/磨砂只有他上真机才知道**。

                ### 4.0.2 云端结果的正确用法（新的硬纪律）
                1. **编译/测试结论必须来自真跑**，不许再用「应该能过」「看起来没问题」交差。
                2. **红了就修，修完再跑**，把红的那段真实输出当证据；不许把明显编译不过的代码留在提交里。
                3. **跑绿了再说绿**，并把证据写进收尾：跑了哪个命令、退出码、耗时；失败时贴报错原文。
                4. **不提交也要能验**（快照模式）；但**交付前该提交的仍要提交**——快照是预检，不是交付物。
                5. **推不推仍然看他**：`dev`/`main` 的推送会触发正式 CI 与预览发布，别自作主张 push，除非他刚说过要推、或这条分支本来就是 PR 用的功能分支。

                ### 4.0.3 收尾怎么说（验证 = 输出最末尾那一块）
                前面写「改了 / 自检」，「待他跑」只在末尾出现一次。因为你能自己验了，「待他跑」的内容变了——**不再是「你自己跑一下 gradle」**，而是：
                - **已经跑过的**：命令 + 退出码 + 结果（例：「`./gradlew :app:compileDebugKotlin` → exit 0，2m57s」）；
                - **验不到的**：真机才能证明的部分（UI 排布、触感、磨砂、运行时崩溃、升级路径），点明让他看哪个页面/哪条路径；
                - **需要 secrets 的**：签名/发版链路你没跑，明说。
                格式仍是**一个代码块装完**（多条命令按顺序排、预期紧跟各自命令下面），不许一条一块，也不许块外夹散文。**打包和装真机一句都不要写**。


                ### 4.1 代码检查：跑 SearchDeadCode，不要再自己肉眼查
                本机已装好 **SearchDeadCode**（`searchdeadcode` 0.21.0，在 `C:\Users\Vxiao\.local\bin\searchdeadcode.exe`，已在用户 PATH）。它直接解析 Kotlin/Java 源码，**不需要 JDK、不需要 Gradle 构建**，正好补上「本机编不了，但能查的必须查干净」这个空缺。

                **死代码、未使用的类/函数/属性/参数/枚举分支、重复 import、只写不读的变量、孤儿事件、没人实例化的 sealed variant——全部交给它判定，不要靠 grep 加印象下结论。** 人手查必漏「只被死代码引用」这种链式死亡，而它给的正是引用图。

                在仓库根跑下面几条。**每条都把 `--cache-path` 指到仓库外**：默认会往仓库根写 `.searchdeadcode-cache.json`，那就把工作区弄脏了。
                ```powershell
                # 1) 主扫描（全仓约 1700 个文件，约 30~40 秒，能一次看到现存 47 条）
                searchdeadcode . --min-confidence high --format compact --cache-path "$env:TEMP\sdc-root.json"

                # 2) 两个被误判成「幽灵源集」的目录必须单独扫（见 §4.1.1 第 1 条）
                searchdeadcode core\src\commonMain --min-confidence high --format compact --cache-path "$env:TEMP\sdc-core.json"
                searchdeadcode data\src\commonMain --min-confidence high --format compact --cache-path "$env:TEMP\sdc-data.json"

                # 3) 只看「我这条分支刚弄死的东西」（提交前最有用）
                searchdeadcode . --changed-since origin/dev --min-confidence high --format compact

                # 4) 想让它像 CI 一样「有发现就红」，必须显式加这个开关（见下面「读结果的口径」）
                searchdeadcode . --min-confidence high --format compact --fail-on-findings --cache-path "$env:TEMP\sdc-root.json"

                # 5) 单个符号判生死：拿它的引用图当证据，别自己猜
                searchdeadcode . --explain SomeFunction
                searchdeadcode . --why-alive SomeFunction
                ```

                读结果的口径（**这条以前写反过，按实测改正**）：
                - **不加 `--fail-on-findings` 时，退出码永远是 0**，哪怕扫出 47 条发现——实测确认。只有加了 `--fail-on-findings` 才「有发现就 exit 1」，那才是 CI 式的红。
                - 所以：**别把「exit 0」当成「干净」**，一定要看输出里有没有 `⚠ DC0xx` 行。反之也**别把 exit 1 当成命令坏了**——那是 `--fail-on-findings` 的正常语义。真正的命令错误是 exit 2（例如路径不存在）。
                - `--format compact` 一行一条：`文件 · 行:列 · 规则 · 一句话`。`DC001` 未使用声明、`DC002` 只写不读、`DC008` 未实例化的 sealed 分支、`DC012` 重复 import。
                - 判据就是它句尾那句 `never used` / `only referenced from dead code — unreachable from any entry point`。不确定就再 `--explain`，看引用链再决定删不删。
                - **当前基线（2026-11-16 实测）**：根扫描 47 条（DC001×44、DC002×3）；`core\src\commonMain` 5 条；`data\src\commonMain` 1 条。这些都是**存量**，不是你的改动引入的——你只对**新增**负责，并在自检里把「存量/新增」分开说。

                ### 4.1.1 它的已知盲区（这几处别盲信）
                1. **幽灵源集误判（最重要）**：`core/src/commonMain`、`data/src/commonMain`、`web/src/commonMain` 在根扫描里会被判成「不属于任何构建」直接排除——因为这几个模块写的是 `commonMain.dependencies { … }`，而它的探测正则只认带引号的 `create("x")` / `getByName("x")` / `srcDir("src/x/")`，抓不到这种写法。**所以必须按 §4.1 第 2 条单独扫 `core\src\commonMain` 与 `data\src\commonMain`**，并在结论里明说「根扫描不含这三处」。
                2. **`core\src` 与 `core\src\commonMain` 深度不同，结果不能混**：单独扫 `core\src`（整个源集树）只报 2 条 DC001，扫 `core\src\commonMain` 却报 5 条——多出的 3 条 DC008（`ShellTarget.App` / `AllPages` / `Custom`「从未实例化」）是**误报**：它们确实被 `app/src/main/.../BottomTab.kt` 与 `core/src/commonTest/.../ShellModelTest.kt` 实例化，只是那个扫描范围看不见。**别照着删**。判这类「跨源集才活」的符号，用根扫描 + `--explain`。
                3. `web/src/commonMain` 下只有 `.webp` 资源、没有 Kotlin，扫它会报 `No Kotlin or Java files found.`——正常，不是配置错。
                4. **变量键读写证不了**：它会提示 `N preference read(s) go through a variable key — write-only verdicts are unprovable`。这类 `DC002`（只写不读）它自己都说证不了，别拿它当铁证去删。
                5. 它**只解析 Kotlin/Java 与 Android XML**，不判 wasm 兼容性、不判依赖方向、不看 Gradle 依赖图（`--unused-deps` 另开才算）。这些仍归你，见 §4.1.2。

                ### 4.1.2 它查不出来、仍归你判断的
                1. **import 与解析**：新写的 import 是否存在、是否被同名类型/扩展函数遮蔽、是否把 `internal` 的东西跨模块用（`DC012` 只抓「重复 import」，不抓「不存在的 import」）。
                2. **跨端（wasmJs）**：`:core`、`:shared:model|navigation|designsystem|network` 的 commonMain 新增代码，逐个核对用到的 API 在 wasm 下是否存在。JVM 专属写法必须替换（`String.format` → 字符串模板、`toSortedMap` → `sortedBy`、`java.time` → `kotlinx-datetime`、`Dispatchers.IO` → `Dispatchers.Default`）。
                3. **依赖方向**：新增 import 是否引入新的模块依赖（`settings.gradle.kts` + 各模块 `build.gradle.kts` 的 `api`/`implementation`）；feature 之间不得互赖、不得把 Android/JVM-only 库带进 commonMain。
                4. **Compose / MIUIX 用法与资源引用**：`@Composable` 是否只在 Composable 上下文调用、`remember`/`LaunchedEffect` 的 key 与捕获值、`Modifier` 链；改 `res/` 就核对 `R` 引用与 `stringResource` 的 id（资源要 `--unused-resources` 才查，默认是关的）。
                5. **文案与资源**：应用只有 zh/en；新增中文串进 `values-zh`，不要留半截调试字、不要写英文占位。
                6. **注册表与同包邻居**：路由表、工具表、设置项清单、枚举 `when` 分支（尤其 `sealed`）是否需要同步；附近有没有近似实现该复用而不是复制。
                7. **文档同步**：动到 `/api/*` 契约、落盘格式、跨端能力时，同步 `docs/api-contract.md`（2089 行）、`docs/storage-layout.md`、`docs/kmp-module-map.md` 对应那节。**`docs/parity-ledger.md` 与 `docs/desktop-port-plan.md` 已不在仓库里**，别再引用它们当依据。

                ### 4.2 收尾要怎么说（验证 = 输出最末尾那一块）
                结构固定：前面照常写「改了 / 自检」，**最后一块是「待他跑」**——只在末尾出现一次，前面不许夹零散命令。`自检` 那行要写清三件事：**跑过哪几条 SearchDeadCode 命令、结果几条（存量/新增分开）**；**云端跑过什么、退出码多少**（例：「`./gradlew :app:compileDebugKotlin` → exit 0，2m57s；`:core:`+`:web:compileKotlinWasmJs` → exit 0，1m31s」）；**§4.1.2 里它查不到的，你另外核了哪几条**。

                末尾那块先写「已提交到 `<分支>` / `<commit>`」，再点明「哪些是真机才能证明的」，最后把命令 + 预期**全部塞进同一个代码块**——一个块里按顺序列完，每条命令下面紧跟自己那行 `# 预期：…`，不要在块与块之间夹散文，也不要一条一块。

                **不要写打包和装真机**。`assemblePreview` / `assembleDebug` / `assembleRelease` / `adb install` 这些是他自己的日常操作，写进去等于废话。下面才是值得点名的「他自己不见得会跑」的部分——而且**先由你在云端跑，跑完把结果写进自检**，只有你确实跑不了的（要 secrets、要真机）才留给他：

                ```powershell
                # ── 这些你应该已经在云端跑过了；只有跑不了时才留给他。打包/装真机不在此列 ──

                # 1) 单元测试（云端可跑，务必自己先跑）
                ./gradlew :app:testDebugUnitTest
                # 预期：BUILD SUCCESSFUL；失败时贴具体失败的用例名

                # 2) 跨端门禁（改了 :core / :web / :shared:* 的 commonMain 就必须跑）
                ./gradlew :core:compileKotlinWasmJs :web:compileKotlinWasmJs
                # 预期：BUILD SUCCESSFUL；报 wasm 找不到符号 = 漏了一个 actual/expect

                # 3) 桌面端（改了 :desktop 才需要；记得先装 fonts-noto-cjk，见 §4.0）
                ./gradlew :desktop:test
                # 预期：BUILD SUCCESSFUL

                # 4) R8 / 资源收缩——要签名口令，只有他的 CI 能跑
                ./gradlew :app:minifyReleaseWithR8
                # 预期：BUILD SUCCESSFUL；运行期才炸的反射问题这一步看不出来，只能真机验
                ```

                只有确认云端不可用（`doctor` 报红）时，才退回「列命令给他跑」的方式；即便那样，也要说清为什么你验不了，别默默把活推回去。

                ## 5. 术语陷阱
                - **屁岱** = 应用内 AI 助手功能（`:feature:agent`、`:shared:model/agent/`、屁岱设置与工具层），**不是你**。维护者说「agent / 代理」时多半也指屁岱，只有上下文是 DSH / Claude Code / 代理流程时才指你。接到 agent 相关任务先确认改的是应用功能。
                - **对账** = 按功能点逐条判定三端有没有真实现（✅真实现 / 🔧没做 / ❌物理不可能 / ➖不适用 / ❓未核实），不是「diff 复查」。**注意 `docs/parity-ledger.md` 已经不在仓库里了**，用 `git log --all -- docs/parity-ledger.md` 找历史或直接问维护者，不要假装读过它。
                - **契约** = `docs/api-contract.md`，`:server` 的 `/api/*` 对外接口真源，唯一消费者是 `:web`。
                - **serve 模式** = `:server` 托管页面 + `/api/*`；页面用 `?backend=serve` 钉死或自动探测（`/api/status` 有没有 `username` 字段）；登录与短信二验走 `/api/session*`。
                - **大屏** = 平板 / 折叠屏 / 横屏分屏，不是桌面端。

                ## 6. 怎么读 `docs/`（别整篇读）
                `docs/` 现在只有 14 篇，最长的 `api-contract.md` 2089 行，其余多在 100~500 行。**`desktop-port-plan.md`、`parity-ledger.md`、`audit-*.md` 已经不存在了**，别去找。
                - 先 grep 关键词 / 端点路径 / 字段名拿到行号，再带 `offset` 读那一小段；
                - 动学校接口前查 `api-contract.md` 对应 `§`；动落盘格式前查 `storage-layout.md`（384 行）；动模块边界前查 `kmp-module-map.md`（337 行）；动预览发版前查 `preview-channel.md`；
                - 需要新增章节时照既有体例（状态行、证据写成「文件:行」、表格），别自创格式；
                - 这些文档里仍残留 `:core`/`:data` 的旧路径描述，**定位模块以 `settings.gradle.kts` 与 `docs/kmp-module-map.md` 为准**。
                - 别整篇读 `api-contract.md`——2089 行读下去既费上下文又没用，先定位。

                ## 7. 干活方式
                - **小步**：一次一个能解释清楚的改动；格式化、重命名与行为修改分开。
                - **提交**：Conventional Commits + 中文，如 `feat(home): …`、`fix(agent): …`、`docs: …`；scope 用模块或功能名；一个 commit 一件事。
                - **分支**：功能/修复分支从 `dev` 拉、PR 回 `dev`，不直推 `main`。仓库的分支名习惯是 `<feat|fix|chore>/<issue 号>-<短横线英文 slug>`（例：`feat/261-color-customization`）——分支名里那个号就是 issue 号，`gh issue view <号> --comments` 能拿到原始需求和维护者实测反馈，动手前值得看一眼。已经在分支上就继续在那条干，不要自己新建分支、不要 rebase 别人的分支。
                - **发版**：维护者没说发版，就别动 `versionName`、`versionCode`、`AppChangelog.kt`、`desktop/build.gradle.kts` 的 `desktopPackageVersion`。真要发版按 DEVELOP.md §1 走全流程（含 `[skip preview]` 的语义），不要自己发明版本号。
                - **不越权**：不擅自重写无关代码、不顺手改格式、不删别人的注释、不动 CI 配置；要动先说明理由再动。
                - **UI**：用 MIUIX（`top.yukonga.miuix.kmp.*`，模式见 `docs/MIUIX-reference.md`）；深浅色都要看；大屏别写死宽度；动画、触感、磨砂这类效果你无法验证，列清楚让维护者看的点，不要假装验过。
                - **注释**：这个仓库的风格是重「为什么」的中文注释，新代码照此；不要写「// 新增」这类空话。

                ## 8. 沟通与收尾
                - 中文、直给结论：先说要做什么 / 做了什么，再给细节；缺关键信息一次性问完，能靠读代码确定的绝不问。
                - **不要用「应该可以」冒充「已验证」，但你能验的必须验**：本机没有 JDK/SDK，可你**有云端 Build-Runner**（§4.0）。编译与测试要真跑过再说结论；真跑不了的（真机 UI/触感/运行时、要 secrets 的签名链路）明确说「这一步我验不到」。**真机和打包是他自己的日常动作，不必提醒。**
                - 对话里每次交付在最后收口，不要长篇；**「待他跑」固定是最后一块，且只在末尾出现一次**：
                  `改了：` 一句话 + 关键文件
                  `自检：` ① 跑过哪几条 SearchDeadCode 命令、各几条结果、本次新增几条（0 条也要明说，存量与新增分开）；② **云端跑过什么、退出码多少、耗时**（这是新增的必填项）；③ §4.1.2 里它查不到的，你另外核了哪几条
                  `待他跑：` **已提交到哪个分支 / 哪个 commit** + 只剩真机才能验的点 + 「预期看到什么」——命令**全部塞进一个代码块**（照 §4.2 的格式，预期写在各条命令下面；一条一块是错的）。**打包和装真机一句都不要写**；确实没有留给他跑的东西时，这块就写「已提交到 `<分支>` / `<commit>`」+「编译与测试已在云端跑过，退出码 0；只剩真机看 X 页面」。

                - **PR 描述**：按仓库现有的 `.github/pull_request_template.md` 填，不要自创结构。四段（模板原文）：
                  ```
                  ## 改了什么

                  -

                  ## 为什么改

                  -

                  ## 怎么验

                  - 机型 / 系统：
                  - [ ] 相关页面按上面路径点过一遍
                  - [ ] 若动到登录、Cookie、校园卡：校内或校外至少走通一条真实路径（不要把账密写进 PR）

                  ## 注意

                  - [ ] 不含密钥、账号材料、HAR、带学号的导出文件
                  - [ ] 用户可见文案已核对，没有半截调试字
                  - [ ] 若只报学校系统状态：请对 `announce` 分支开 PR，并用公告模板；不会改 JSON 开 Issue 即可
                  ```
                  纪律：**只勾真正做过的事**，本机没验证的不要勾；「怎么验」要写成维护者能在真机/云端照着做的具体路径（点哪个页面、看哪条数据），不要写「已自测通过」。「机型 / 系统」留空或写维护者告诉你的机型，**不要自己编**。**任何时候不把账密、Cookie、密钥、HAR、带学号的导出文件写进 PR 或截图。**
