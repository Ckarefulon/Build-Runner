# Build-Runner — package build outputs and publish a release.
#
# Runs the same way as run.yml (central engine: checks out the TARGET repo and
# builds there), then in the SAME job:
#
#   1. zips the requested output paths,
#   2. commits the package to the root of the target repository on a dedicated
#      branch (never the user's working branch — that would push into a branch
#      nobody asked to modify, and would trip branch protection),
#   3. publishes a GitHub Release in the BUILD-RUNNER repository with the
#      package attached.
#
# Why packaging happens here and not in the MCP client: the outputs already
# live on the runner. Downloading them to the caller's machine only to upload
# them again costs the exact bytes this tool exists to avoid moving, and breaks
# down for artifacts larger than memory.
name: Build Runner Release

run-name: build-runner-release-${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Opaque caller-supplied id used to locate this run.'
        required: false
        default: ''
      repo:
        description: 'Target repository (owner/name). Empty means this runner repo.'
        required: false
        default: ''
      ref:
        description: 'Branch, tag or SHA of the target repository.'
        required: false
        default: ''
      command:
        description: 'Build command that produces the outputs.'
        required: true
        default: ''
      artifact_paths:
        description: 'Paths to package (comma or newline separated globs).'
        required: true
      package_name:
        description: 'Package file name (without extension). Default: <repo>-<shortsha>'
        required: false
        default: ''
      release_tag:
        description: 'Release tag. Default: <repo>-<shortsha>'
        required: false
        default: ''
      release_repo:
        description: 'Repository that hosts the Release. Default: this runner repo.'
        required: false
        default: ''
      release_title:
        description: 'Release title. Default: derived from the package name.'
        required: false
        default: ''
      release_notes:
        description: 'Extra release notes appended to the generated body.'
        required: false
        default: ''
      draft:
        description: 'true = create the release as a draft.'
        required: false
        default: 'false'
      commit_to_repo:
        description: 'true = also commit the package to the root of the target repo.'
        required: false
        default: 'true'
      commit_branch:
        description: 'Branch in the target repo that receives the package.'
        required: false
        default: 'builds'
      shell:
        description: 'Interpreter: bash | pwsh | python'
        required: false
        default: 'bash'
      runner:
        description: 'Runner label.'
        required: false
        default: 'ubuntu-latest'
      setup:
        description: 'Optional pre-commands (install deps etc).'
        required: false
        default: ''
      timeout_minutes:
        description: 'Cap for the build step, in minutes (1-120).'
        required: false
        default: '30'
      fetch_depth:
        description: 'git fetch depth (0 = full history)'
        required: false
        default: '1'
      workspace_patch:
        description: 'Base64 patch of local changes, applied after checkout.'
        required: false
        default: ''
      patch_ref:
        description: 'Branch in THIS repo holding the workspace patch (used when too big for an input).'
        required: false
        default: ''

permissions:
  # Needed to create the Release (and its asset) in the runner repository.
  contents: write

env:
  PYTHONUNBUFFERED: '1'
  CI: 'true'

concurrency:
  group: build-runner-release-${{ inputs.repo }}-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: build and publish
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 120
    steps:
      - name: Resolve target
        id: t
        shell: bash
        env:
          IN_REPO: ${{ inputs.repo }}
          IN_REF: ${{ inputs.ref }}
          IN_DEPTH: ${{ inputs.fetch_depth }}
          THIS_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          repo="${IN_REPO:-$THIS_REPO}"
          ref="${IN_REF:-$DEFAULT_BRANCH}"
          echo "repo=$repo"           >> "$GITHUB_OUTPUT"
          echo "ref=$ref"             >> "$GITHUB_OUTPUT"
          echo "depth=${IN_DEPTH:-1}" >> "$GITHUB_OUTPUT"
          echo "Target repository : $repo"
          echo "Target ref        : $ref"

      - name: Checkout target
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.t.outputs.repo }}
          ref: ${{ steps.t.outputs.ref }}
          token: ${{ secrets.checkout_token || github.token }}
          fetch-depth: ${{ steps.t.outputs.depth == '0' && '0' || steps.t.outputs.depth }}
          # Credentials are needed to push the package back later.
          persist-credentials: true

      - name: Record revision
        id: rev
        shell: bash
        run: |
          set +e
          set +o pipefail
          sha=$(git rev-parse HEAD)
          short=$(git rev-parse --short HEAD)
          subject=$(git log -1 --pretty=%s)
          echo "sha=$sha"     >> "$GITHUB_OUTPUT"
          echo "short=$short" >> "$GITHUB_OUTPUT"
          echo "Checked out $sha ($subject)"
          exit 0

      - name: Enable package managers
        shell: bash
        run: |
          set +e
          set +o pipefail
          if command -v corepack >/dev/null 2>&1; then
            corepack enable >/dev/null 2>&1
            corepack prepare pnpm@latest --activate >/dev/null 2>&1
          fi
          exit 0

      - name: Environment
        shell: bash
        run: |
          set +e
          set +o pipefail
          echo "runner : $RUNNER_OS / $RUNNER_ARCH"
          echo "workdir: $(pwd)"
          for c in node npm pnpm python3 java zip tar sha256sum; do
            if command -v "$c" >/dev/null 2>&1; then
              printf '%-10s %s\n' "$c" "$("$c" --version 2>&1 </dev/null | head -n 1)"
            fi
          done
          exit 0

      # Android's debug keystore is generated on first use with RANDOM keys, and
      # every hosted runner starts blank. Each build therefore signs with a
      # different key, and installing over a previous debug build fails with
      # "signatures do not match" / INSTALL_FAILED_UPDATE_INCOMPATIBLE.
      #
      # The debug key itself is fine — the problem is that it kept changing. One
      # stable keystore, restored from cache, makes repeated debug installs work.
      # This lives in the release workflow too because packages are built here.
      # One key per target repo, with the slash sanitized: a cache key may only
      # contain [-_.A-Za-z0-9], so `owner/repo` produced an invalid key and the
      # keystore was never actually restored — it was regenerated on every run.
      - name: Compute cache scope
        id: scope
        shell: bash
        env:
          IN_REPO: ${{ steps.t.outputs.repo }}
        run: |
          set +e
          set +o pipefail
          s=$(printf '%s' "${IN_REPO:-this-repo}" | tr '/' '-' | tr -cd 'A-Za-z0-9._-' | cut -c1-80)
          echo "scope=$s" >> "$GITHUB_OUTPUT"
          echo "cache scope: $s"
          exit 0

      - name: Restore Android debug keystore
        id: androidkey
        if: ${{ true }}
        uses: actions/cache@v4
        with:
          path: ~/.android
          key: br-android-debug-${{ runner.os }}-${{ steps.scope.outputs.scope }}

      - name: Ensure debug keystore exists
        if: ${{ true }}
        shell: bash
        run: |
          set +e
          set +o pipefail
          mkdir -p "$HOME/.android"
          if [ -f "$HOME/.android/debug.keystore" ]; then
            echo "debug.keystore 已存在（来自缓存），签名保持一致"
            if command -v keytool >/dev/null 2>&1; then
              keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android 2>/dev/null \
                | grep -iE "SHA1|SHA-256" | head -2
            fi
          else
            if command -v keytool >/dev/null 2>&1; then
              keytool -genkeypair -v \
                -keystore "$HOME/.android/debug.keystore" \
                -storepass android -keypass android -alias androiddebugkey \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US" >/dev/null 2>&1 \
                && echo "已生成固定 debug.keystore" \
                || echo "keytool 生成失败，交给 Gradle 自动生成"
            else
              echo "无 keytool，交给 Gradle 自动生成（随后会缓存）"
            fi
          fi
          exit 0

      # Apply the caller's local changes without creating any branch in the
      # target repository. See run.yml for the rationale behind `-3`.
      - name: Fetch workspace patch
        if: ${{ inputs.patch_ref != '' }}
        shell: bash
        env:
          IN_REF: ${{ inputs.patch_ref }}
        run: |
          set +e
          set +o pipefail
          url="https://raw.githubusercontent.com/${{ github.repository }}/${IN_REF}/.build-runner/workspace.patch"
          echo "获取补丁：$url"
          if ! curl -fsSL "$url" -o /tmp/br.patch.raw; then
            echo "::error::无法获取补丁分支 ${IN_REF}"
            exit 1
          fi
          # Transport may be raw diff (git-data) or base64 (contents API).
          head -c 5 /tmp/br.patch.raw | grep -q '^diff ' && is_raw=1 || is_raw=0
          if [ "$is_raw" = "1" ]; then
            cp /tmp/br.patch.raw /tmp/br.patch
            echo "补丁格式：原始 diff"
          else
            base64 -d < /tmp/br.patch.raw > /tmp/br.patch 2>/dev/null \
              || { echo "::error::补丁格式无法识别"; exit 1; }
            echo "补丁格式：base64（已解码）"
          fi
          echo "补丁大小：$(wc -c < /tmp/br.patch | tr -d ' ') 字节"
          exit 0

      - name: Apply workspace patch
        if: ${{ inputs.patch_ref != '' || inputs.workspace_patch != '' }}
        shell: bash
        env:
          IN_PATCH: ${{ inputs.workspace_patch }}
        run: |
          set +e
          set +o pipefail
          if [ -n "$IN_PATCH" ]; then
            printf '%s' "$IN_PATCH" | base64 -d > /tmp/br.patch
          fi
          if [ ! -s /tmp/br.patch ]; then
            echo "补丁为空，跳过"
            exit 0
          fi
          if git apply --binary --whitespace=nowarn /tmp/br.patch; then
            echo "::notice::已应用本地改动补丁"
          elif git apply --binary --whitespace=nowarn -3 /tmp/br.patch; then
            echo "::notice::已用三方合并应用本地改动补丁"
          else
            echo "::error::补丁应用失败：云端代码与本地不一致，拒绝继续构建"
            git apply --stat /tmp/br.patch | head -20
            exit 1
          fi
          git status --porcelain | head -30
          exit 0

      # Gradle caching + configuration cache.
      #
      # `problems=warn` makes a configuration-cache violation degrade to a normal
      # build instead of failing, which is what makes this safe for arbitrary
      # projects. Measured: config phase 44s -> 5s on repeat invocations; on an
      # incompatible project the only cost is running the config phase twice.
      - name: Gradle tuning
        if: ${{ hashFiles('**/build.gradle.kts', '**/build.gradle') != '' }}
        shell: bash
        run: |
          set +e
          set +o pipefail
          props="$HOME/.gradle/gradle.properties"
          mkdir -p "$(dirname "$props")"
          {
            echo '# injected by build-runner'
            echo 'org.gradle.caching=true'
            echo 'org.gradle.daemon=false'
            echo 'org.gradle.configuration-cache=true'
            echo 'org.gradle.configuration-cache.problems=warn'
          } > "$props"
          cat "$props"
          exit 0

      - name: Setup commands
        if: ${{ inputs.setup != '' }}
        shell: bash
        env:
          IN_SETUP: ${{ inputs.setup }}
          IN_SHELL: ${{ inputs.shell }}
        run: |
          set -euo pipefail
          case "${IN_SHELL:-bash}" in
            pwsh|powershell) ext=ps1 ;;
            python)          ext=py  ;;
            *)               ext=sh  ;;
          esac
          printf '%s\n' "$IN_SETUP" > "/tmp/br-setup.$ext"
          case "${IN_SHELL:-bash}" in
            pwsh|powershell) pwsh -NoProfile -File "/tmp/br-setup.ps1" ;;
            python)          python3 "/tmp/br-setup.py" 2>/dev/null || python "/tmp/br-setup.py" ;;
            *)               bash "/tmp/br-setup.sh" ;;
          esac

      - name: Build
        id: build
        shell: bash
        timeout-minutes: ${{ fromJSON(inputs.timeout_minutes) }}
        env:
          IN_COMMAND: ${{ inputs.command }}
          IN_SHELL: ${{ inputs.shell }}
        run: |
          set -uo pipefail
          case "${IN_SHELL:-bash}" in
            pwsh|powershell) ext=ps1 ;;
            python)          ext=py  ;;
            *)               ext=sh  ;;
          esac
          printf '%s\n' "$IN_COMMAND" > "/tmp/br-run.$ext"
          echo "--- build command ---"
          head -n 40 "/tmp/br-run.$ext"
          echo "--- BUILD-RUNNER-OUTPUT-BEGIN ---"
          set +e
          case "${IN_SHELL:-bash}" in
            pwsh|powershell) pwsh -NoProfile -File "/tmp/br-run.ps1" ;;
            python)          python3 "/tmp/br-run.py" 2>/dev/null || python "/tmp/br-run.py" ;;
            *)               bash "/tmp/br-run.sh" ;;
          esac
          rc=$?
          set -e
          echo "--- BUILD-RUNNER-OUTPUT-END ---"
          echo "BUILD-RUNNER-EXIT-CODE=$rc"
          if [ "$rc" -ne 0 ]; then
            echo "build-runner: build failed with exit code $rc" >&2
          fi
          exit "$rc"

      # ------------------------------------------------------------- package --
      - name: Package outputs
        id: pkg
        if: ${{ success() }}
        shell: bash
        env:
          IN_PATHS: ${{ inputs.artifact_paths }}
          IN_NAME: ${{ inputs.package_name }}
          IN_TAG: ${{ inputs.release_tag }}
          REPO_SLUG: ${{ steps.t.outputs.repo }}
          SHORT_SHA: ${{ steps.rev.outputs.short }}
        run: |
          set -uo pipefail
          slug_safe() { printf '%s' "$1" | tr '/' '-' | tr -cd 'A-Za-z0-9._-'; }

          name="${IN_NAME:-$(slug_safe "$REPO_SLUG")-${SHORT_SHA}}"
          tag="${IN_TAG:-$name}"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "tag=$tag"   >> "$GITHUB_OUTPUT"

          # Collect the matched paths first. `zip -r` with a glob that matches
          # nothing produces an empty but valid archive, which would silently
          # publish a useless package — so fail loudly instead.
          mapfile -t paths < <(printf '%s\n' "$IN_PATHS" | tr ',' '\n' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' | grep -v '^$')
          matched=()
          for p in "${paths[@]}"; do
            # shellcheck disable=SC2206
            found=( $p )
            for f in "${found[@]}"; do
              [ -e "$f" ] && matched+=("$f")
            done
          done
          if [ "${#matched[@]}" -eq 0 ]; then
            echo "::error::artifact_paths 没有匹配到任何文件：$IN_PATHS"
            exit 1
          fi

          echo "--- packaging ${#matched[@]} path(s) ---"
          printf '  %s\n' "${matched[@]:0:40}"

          # A single artifact (the common case: one APK, one jar) is published
          # AS-IS. Wrapping one file in a zip adds no value, and an APK inside a
          # zip cannot be installed directly on a phone — every consumer has to
          # unzip first. Only multiple paths / directories get archived.
          zipfile=""
          if [ "${#matched[@]}" -eq 1 ] && [ -f "${matched[0]}" ]; then
            src="${matched[0]}"
            base=$(basename "$src")
            # The extension must stay LAST: a file named `foo.apk.debug` is not
            # installable because Android keys off the extension. So the asset is
            # `<package name>.<original extension>`.
            if [ "$base" = "${base##*.}" ]; then
              ext="bin"
            else
              ext="${base##*.}"
            fi
            case "$name" in
              *".$ext") zipfile="$name" ;;
              *)        zipfile="${name}.${ext}" ;;
            esac
            cp -f "$src" "./$zipfile"
            echo "单文件产物：直接发布 $zipfile（不打包）"
          else
            zipfile="${name}.zip"
            rm -f "$zipfile"
            if command -v zip >/dev/null 2>&1; then
              zip -r -q "$zipfile" "${matched[@]}"
            else
              tar -czf "${name}.tar.gz" "${matched[@]}"
              zipfile="${name}.tar.gz"
            fi
            echo "多路径产物：已归档 $zipfile"
          fi

          bytes=$(wc -c < "$zipfile" | tr -d ' ')
          if command -v sha256sum >/dev/null 2>&1; then
            sum=$(sha256sum "$zipfile" | cut -d' ' -f1)
          else
            sum=$(shasum -a 256 "$zipfile" | cut -d' ' -f1)
          fi
          echo "file=$zipfile" >> "$GITHUB_OUTPUT"
          echo "bytes=$bytes" >> "$GITHUB_OUTPUT"
          echo "sha256=$sum"  >> "$GITHUB_OUTPUT"
          echo "Package $zipfile ($bytes bytes, sha256 $sum)"

      # --------------------------------------------------- commit to the repo --
      # A dedicated branch: pushing into the branch that was just built would
      # modify a branch nobody asked to touch, and would be rejected outright
      # when that branch is protected.
      - name: Commit package to target repo
        id: commit
        if: ${{ success() && inputs.commit_to_repo == 'true' }}
        shell: bash
        env:
          REPO_SLUG: ${{ steps.t.outputs.repo }}
          BRANCH: ${{ inputs.commit_branch }}
          PKG_FILE: ${{ steps.pkg.outputs.file }}
          PKG_NAME: ${{ steps.pkg.outputs.name }}
          TARGET_REF: ${{ steps.t.outputs.ref }}
        run: |
          set -uo pipefail
          if [ -z "${BRANCH:-}" ]; then echo "commit_branch 为空，跳过"; exit 0; fi

          # Work on an orphan-free copy of just the package: use a temporary
          # worktree of the target branch so the build directory is never
          # disturbed and no unrelated files leak into the commit.
          git config user.email "build-runner@users.noreply.github.com"
          git config user.name  "build-runner"

          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch --depth=1 origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
          else
            git checkout --orphan "$BRANCH"
            git rm -rf --cached . >/dev/null 2>&1 || true
            git clean -fdx -e "$PKG_FILE" >/dev/null 2>&1 || true
          fi

          cp -f "$PKG_FILE" "./$(basename "$PKG_FILE")" 2>/dev/null || true
          git add -f "$(basename "$PKG_FILE")"

          if git diff --cached --quiet; then
            echo "包内容没有变化，跳过提交"
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -q -m "build-runner: publish ${PKG_NAME} (from ${TARGET_REF})"
          if git push origin "HEAD:$BRANCH"; then
            sha=$(git rev-parse HEAD)
            echo "committed=true"  >> "$GITHUB_OUTPUT"
            echo "commit_sha=$sha" >> "$GITHUB_OUTPUT"
            echo "提交到 ${REPO_SLUG}@${BRANCH} → $sha"
          else
            echo "::warning::推送到 ${BRANCH} 失败（可能是分支保护），Release 仍会发布"
            echo "committed=false" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      # ------------------------------------------------------------- release --
      - name: Publish release
        id: rel
        if: ${{ success() }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.release_token || github.token }}
          RELEASE_REPO: ${{ inputs.release_repo }}
          DEFAULT_REPO: ${{ github.repository }}
          PKG_FILE: ${{ steps.pkg.outputs.file }}
          PKG_NAME: ${{ steps.pkg.outputs.name }}
          TAG: ${{ steps.pkg.outputs.tag }}
          TITLE: ${{ inputs.release_title }}
          NOTES: ${{ inputs.release_notes }}
          DRAFT: ${{ inputs.draft }}
          TARGET_REPO: ${{ steps.t.outputs.repo }}
          TARGET_REF: ${{ steps.t.outputs.ref }}
          TARGET_SHA: ${{ steps.rev.outputs.sha }}
          SHA256: ${{ steps.pkg.outputs.sha256 }}
          COMMIT_SHA: ${{ steps.commit.outputs.commit_sha }}
          COMMIT_BRANCH: ${{ inputs.commit_branch }}
        run: |
          set -uo pipefail
          target_repo="${RELEASE_REPO:-$DEFAULT_REPO}"
          title="${TITLE:-$PKG_NAME}"

          body=$(cat <<EOF
          Build-Runner 产物包

          - 源仓库：\`${TARGET_REPO}\`
          - 源版本：\`${TARGET_REF}\` @ \`${TARGET_SHA}\`
          - 包内文件：详见压缩包
          - SHA256：\`${SHA256}\`
          EOF
          )
          if [ -n "${COMMIT_SHA:-}" ]; then
            body="${body}
          - 同步提交：\`${TARGET_REPO}\`@\`${COMMIT_BRANCH}\` → \`${COMMIT_SHA}\`"
          fi
          if [ -n "${NOTES:-}" ]; then
            body="${body}

          ---

          ${NOTES}"
          fi

          args=(release create "$TAG" "$PKG_FILE" --repo "$target_repo" --title "$title" --notes "$body")
          if [ "${DRAFT:-false}" = "true" ]; then args+=(--draft); fi

          if out=$(gh "${args[@]}" 2>&1); then
            echo "Release 已发布：$out"
            echo "url=$out" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG"  >> "$GITHUB_OUTPUT"
          else
            # A re-run for the same tag must not fail the whole job: replace the
            # asset on the existing release instead.
            echo "$out"
            if gh release view "$TAG" --repo "$target_repo" >/dev/null 2>&1; then
              echo "tag 已存在，改为覆盖资产"
              gh release upload "$TAG" "$PKG_FILE" --repo "$target_repo" --clobber
              url=$(gh release view "$TAG" --repo "$target_repo" --json url --jq .url)
              echo "url=$url" >> "$GITHUB_OUTPUT"
              echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            else
              echo "::error::Release 发布会失败：$out"
              exit 1
            fi
          fi
          exit 0

      - name: Report
        if: always()
        shell: bash
        env:
          TARGET_REPO: ${{ steps.t.outputs.repo }}
          TARGET_REF: ${{ steps.t.outputs.ref }}
          TARGET_SHA: ${{ steps.rev.outputs.short }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          PKG_NAME: ${{ steps.pkg.outputs.name }}
          PKG_BYTES: ${{ steps.pkg.outputs.bytes }}
          PKG_SHA: ${{ steps.pkg.outputs.sha256 }}
          REL_TAG: ${{ steps.rel.outputs.tag }}
          REL_URL: ${{ steps.rel.outputs.url }}
          COMMITTED: ${{ steps.commit.outputs.committed }}
        run: |
          echo "================ BUILD-RUNNER-RELEASE-REPORT-V1 ================"
          echo "repo=$TARGET_REPO"
          echo "ref=$TARGET_REF"
          echo "sha=$TARGET_SHA"
          echo "build_outcome=$BUILD_OUTCOME"
          echo "package=$PKG_NAME"
          echo "package_bytes=$PKG_BYTES"
          echo "package_sha256=$PKG_SHA"
          echo "release_tag=$REL_TAG"
          echo "release_url=$REL_URL"
          echo "committed=$COMMITTED"
          echo "=================================================================="

      # NOTE: the patch branch is reused and overwritten, not deleted — a cleanup
      # step would cost an extra container step to remove something the next
      # build of the same target overwrites.
