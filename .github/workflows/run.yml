# Build-Runner — remote command execution engine.
#
# This is the CENTRAL engine: it lives in this repository and runs commands
# against OTHER repositories, so no target repository needs a workflow file.
# A caller dispatches this workflow with `repo` + `ref` + `command`; the job
# checks the requested repository out and runs the command inside it.
#
# The MCP server in `mcp/` dispatches this, polls the run, and pulls the job
# log back through the Actions logs API, so the calling AI sees stdout/stderr
# and the real exit code exactly as if it had run the command locally.
name: Build Runner

# Every dispatch carries a unique `tag`. Stamping it into the run's display
# title is the only reliable way for the caller to find the run it just
# created: workflow_dispatch returns 204 with no run id, and two dispatches can
# land in the same second.
run-name: build-runner-${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Opaque caller-supplied id used to locate this run.'
        required: false
        default: ''
      repo:
        description: 'Target repository (owner/name). Empty means this runner repo.'
        required: false
        default: ''
      ref:
        description: 'Branch, tag or full commit SHA of the target repository.'
        required: false
        default: ''
      command:
        description: 'Shell command(s) to execute inside the checkout.'
        required: true
      shell:
        description: 'Interpreter: bash | pwsh | python'
        required: false
        default: 'bash'
      runner:
        description: 'Runner label, e.g. ubuntu-latest / windows-latest / macos-latest.'
        required: false
        default: 'ubuntu-latest'
      timeout_minutes:
        description: 'Cap for the command step, in minutes (1-120).'
        required: false
        default: '30'
      setup:
        description: 'Optional pre-commands (install deps etc) run before the main command.'
        required: false
        default: ''
      cache:
        description: 'Dependency cache: auto | none'
        required: false
        default: 'auto'
      artifact_paths:
        description: 'Newline or comma separated paths to upload as artifacts.'
        required: false
        default: ''
      fetch_depth:
        description: 'git fetch depth (0 = full history)'
        required: false
        default: '1'

permissions:
  contents: read

# Serialize runs that target the same repository + ref.
#
# Without this, two concurrent builds of one project can both publish a snapshot
# to the same branch and race: the second push wins, but the run that already
# started may have checked out the first tree, so each caller gets a result for
# code that is no longer what the branch points at.
#
# cancel-in-progress is false on purpose. Cancelling would drop a caller that is
# actively waiting for output; queueing costs runner time but never a wrong answer.
concurrency:
  group: build-runner-${{ inputs.repo || github.repository }}-${{ inputs.ref || github.event.repository.default_branch }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'
  CI: 'true'

jobs:
  run:
    name: run command
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 120
    steps:
      # ---------------------------------------------------------------- resolve --
      - name: Resolve target
        id: t
        shell: bash
        env:
          IN_REPO: ${{ inputs.repo }}
          IN_REF: ${{ inputs.ref }}
          IN_DEPTH: ${{ inputs.fetch_depth }}
          THIS_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          repo="${IN_REPO:-$THIS_REPO}"
          ref="${IN_REF:-$DEFAULT_BRANCH}"
          depth="${IN_DEPTH:-1}"
          echo "repo=$repo"   >> "$GITHUB_OUTPUT"
          echo "ref=$ref"     >> "$GITHUB_OUTPUT"
          echo "depth=$depth" >> "$GITHUB_OUTPUT"
          echo "Target repository : $repo"
          echo "Target ref        : $ref"
          echo "Fetch depth       : $depth"

      # The target repository is usually PRIVATE, and the default GITHUB_TOKEN
      # of THIS repo cannot read it. `checkout_token` is a secret holding a
      # token that can. Absent it we fall back to the default token, which is
      # enough for public targets and same-repository runs.
      - name: Checkout target
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.t.outputs.repo }}
          ref: ${{ steps.t.outputs.ref }}
          token: ${{ secrets.checkout_token || github.token }}
          # `steps.t.outputs.depth` is a string; passing "0" through fromJSON
          # yields 0 which checkout treats as unlimited, but an empty/odd value
          # falls back to 1. Compare explicitly so "0" means full history.
          fetch-depth: ${{ steps.t.outputs.depth == '0' && '0' || steps.t.outputs.depth }}
          persist-credentials: false

      - name: Record revision
        id: rev
        shell: bash
        run: |
          set +e
          set +o pipefail
          sha=$(git rev-parse HEAD)
          short=$(git rev-parse --short HEAD)
          subject=$(git log -1 --pretty=%s)
          author=$(git log -1 --pretty='%an <%ae>')
          date=$(git log -1 --pretty=%ad)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short=$short" >> "$GITHUB_OUTPUT"
          echo "Checked out $sha ($subject)"
          echo "author: $author"
          echo "date:   $date"
          exit 0

      # ------------------------------------------------------------------ cache --
      # Auto-detect the package manager and reuse its store across runs.
      #
      # Cache key scoping matters more than it looks. Every target project runs
      # through THIS one workflow, so all of them share one cache pool owned by
      # the engine repo. Without a repo component in the key:
      #   * project B's exact key misses, then `restore-keys: br-Linux-` hands it
      #     project A's Gradle cache — wrong artifacts, wasted restore time;
      #   * everything competes for one 10 GB budget, so busy projects evict each
      #     other and start missing on every run, which is slower than no cache.
      # The target slug is therefore part of both the key and the restore prefix.
      - name: Detect caches
        id: cache
        shell: bash
        env:
          IN_CACHE: ${{ inputs.cache }}
          TARGET_REPO: ${{ steps.t.outputs.repo }}
        run: |
          set +e
          set +o pipefail
          paths=""
          key=""
          # owner/name -> owner-name. Also caps length and strips anything that
          # is not cache-key safe, since a key may only contain [-_.A-Za-z0-9].
          scope=$(printf '%s' "${TARGET_REPO:-this-repo}" \
            | tr '/' '-' \
            | tr -cd 'A-Za-z0-9._-' \
            | cut -c1-80)
          if [ "${IN_CACHE:-auto}" != "none" ]; then
            if   [ -f pnpm-lock.yaml ];      then paths="$HOME/.local/share/pnpm/store
          $HOME/Library/pnpm/store
          $HOME/AppData/Local/pnpm/store"; key="pnpm"
            elif [ -f yarn.lock ];           then paths="$HOME/.cache/yarn"; key="yarn"
            elif [ -f package-lock.json ];   then paths="$HOME/.npm";        key="npm"
            elif [ -f gradle.properties ] || [ -f build.gradle.kts ] || [ -f build.gradle ]; then
              # Narrow, targeted paths instead of all of ~/.gradle/caches.
              # The full directory archives to ~600 MB and costs ~16s just to
              # download and unpack; most of it (file-hashes, worker locks,
              # journal-1) is per-run scratch that can never be reused.
              paths="$HOME/.gradle/caches/modules-2
          $HOME/.gradle/caches/*/transforms
          $HOME/.gradle/caches/*/kotlin-dsl
          $HOME/.gradle/wrapper"; key="gradle"
            elif [ -f pom.xml ];             then paths="$HOME/.m2/repository"; key="maven"
            elif [ -f Cargo.toml ];          then paths="$HOME/.cargo/registry
          $HOME/.cargo/git
          target"; key="cargo"
            elif [ -f requirements.txt ] || [ -f pyproject.toml ]; then paths="$HOME/.cache/pip"; key="pip"
            elif [ -f go.mod ];              then paths="$HOME/go/pkg/mod"; key="go"
            fi
          fi
          if [ -n "$key" ]; then
            lock=$(ls -1 pnpm-lock.yaml yarn.lock package-lock.json build.gradle.kts build.gradle pom.xml Cargo.toml requirements.txt pyproject.toml go.mod 2>/dev/null | head -n 1)
            hash=$(git hash-object "$lock" 2>/dev/null | cut -c1-16)
            [ -n "$hash" ] || hash=none
            {
              echo "path<<__CACHE_PATHS__"
              printf '%s\n' "$paths"
              echo "__CACHE_PATHS__"
            } >> "$GITHUB_OUTPUT"
            echo "scope=$scope" >> "$GITHUB_OUTPUT"
            echo "key=$key-$hash" >> "$GITHUB_OUTPUT"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Dependency cache: $key ($lock @ $hash) scoped to $scope"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Dependency cache: disabled"
          fi
          exit 0

      - name: Restore cache
        if: ${{ steps.cache.outputs.enabled == 'true' }}
        uses: actions/cache@v4
        with:
          path: ${{ steps.cache.outputs.path }}
          key: br-${{ runner.os }}-${{ steps.cache.outputs.scope }}-${{ steps.cache.outputs.key }}
          # Restore prefix is ALSO scoped. A bare `br-Linux-` prefix would let
          # one project restore another project's dependency cache on a miss,
          # which is both wrong and slower than a clean download.
          restore-keys: br-${{ runner.os }}-${{ steps.cache.outputs.scope }}-

      # Gradle BUILD cache — a different layer from the dependency cache above.
      # The dependency cache stops re-downloading jars; this stops re-COMPILING.
      # Measured on a small project: dependency cache alone leaves the build at
      # ~18-22s; with build outputs reused an unchanged task set drops to a few
      # seconds. Keyed per repo and per lockfile so a project never receives
      # another project's compiled classes.
      - name: Restore Gradle build cache
        id: buildcache
        if: ${{ hashFiles('build.gradle.kts', 'build.gradle', 'settings.gradle.kts', 'settings.gradle') != '' }}
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/build-cache-1
            ~/.gradle/build-cache-1
          key: br-buildcache-${{ runner.os }}-${{ steps.cache.outputs.scope }}-${{ hashFiles('**/*.gradle.kts', '**/*.gradle', '**/gradle-wrapper.properties') }}
          restore-keys: |
            br-buildcache-${{ runner.os }}-${{ steps.cache.outputs.scope }}-

      # ---------------------------------------------------------------- execute --
      # Android's debug keystore is generated on first use with RANDOM keys, and
      # every hosted runner starts as a blank machine. So each build signs with a
      # different key, and installing over a previous debug build fails with
      # "signatures do not match" / INSTALL_FAILED_UPDATE_INCOMPATIBLE.
      #
      # The fix is not to use a different key — the debug key is fine — but to
      # stop it from being regenerated: cache ~/.android so one stable debug
      # keystore is reused across runs.
      - name: Restore Android debug keystore
        id: androidkey
        if: ${{ true }}
        uses: actions/cache@v4
        with:
          path: ~/.android
          key: br-android-debug-${{ runner.os }}-${{ steps.cache.outputs.scope }}
          restore-keys: |
            br-android-debug-${{ runner.os }}-

      - name: Ensure debug keystore exists
        if: ${{ true }}
        shell: bash
        run: |
          set +e
          set +o pipefail
          mkdir -p "$HOME/.android"
          if [ -f "$HOME/.android/debug.keystore" ]; then
            echo "debug.keystore 已存在（来自缓存），签名保持一致"
            if command -v keytool >/dev/null 2>&1; then
              keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android 2>/dev/null \
                | grep -i "SHA1\|SHA-256" | head -2
            fi
          else
            # Pre-generate with the well-known Android debug parameters so the
            # key is identical on every run rather than randomly regenerated.
            if command -v keytool >/dev/null 2>&1; then
              keytool -genkeypair -v \
                -keystore "$HOME/.android/debug.keystore" \
                -storepass android -keypass android -alias androiddebugkey \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US" >/dev/null 2>&1 \
                && echo "已生成固定 debug.keystore" \
                || echo "keytool 生成失败，交给 Gradle 自动生成"
            else
              echo "无 keytool，交给 Gradle 自动生成（会在本步后缓存）"
            fi
          fi
          exit 0

      # Toolchain probe used to take 29s — longer than the build itself — because
      # it ran `--version` on 21 tools, most of which the command never touches.
      # It now probes ONLY the tools named in the command, reads versions in
      # parallel, and gives each a hard timeout so one hanging binary cannot
      # stall the job. Measured cost: ~2s instead of 29s.
      #
      # `set +e` / `+o pipefail` is still required: GitHub runs bash steps with
      # `-e -o pipefail`, and a probe exits non-zero when the tool is absent.
      - name: Environment
        shell: bash
        env:
          IN_COMMAND: ${{ inputs.command }}
        run: |
          set +e
          set +o pipefail
          echo "::group::build-runner environment"
          echo "runner : $RUNNER_OS / $RUNNER_ARCH"
          echo "workdir: $(pwd)"

          # Only probe interpreters/packagers that appear in the command text.
          candidates="node npm pnpm yarn python python3 pip java javac gradle mvn docker dotnet go rustc cargo gcc g++ make cmake bun deno"
          found=0
          for c in $candidates; do
            printf '%s' "$IN_COMMAND" | grep -qw -- "$c" || continue
            found=1
            if command -v "$c" >/dev/null 2>&1; then
              v=$(timeout 5 "$c" --version 2>&1 </dev/null </dev/null | head -n 1)
              printf '%-8s %s\n' "$c" "${v:-?}"
            else
              printf '%-8s %s\n' "$c" '(未安装)'
            fi
          done
          [ "$found" = "0" ] && echo "(命令未引用已知工具链，已跳过探测)"
          echo "::endgroup::"
          exit 0

      # Same wrapper shape as "Run command", minus the exit-code plumbing: a
      # failing setup should fail the job, which is exactly what `set -e` gives.
      # Hosted runners ship Node but NOT pnpm/yarn, and the single most common
      # command an AI sends is `pnpm install && pnpm build`. Enabling corepack
      # costs about a second and removes that whole class of exit-127 surprise.
      # It is a no-op when the tools already exist or the repo does not use them.
      - name: Enable package managers
        shell: bash
        run: |
          set +e
          set +o pipefail
          echo "::group::build-runner package managers"
          need=0
          if [ -f pnpm-lock.yaml ] || [ -f pnpm-workspace.yaml ] || grep -qs '"packageManager"' package.json; then need=1; fi
          if [ -f yarn.lock ]; then need=1; fi
          if command -v corepack >/dev/null 2>&1; then
            if [ "$need" = "1" ] || ! command -v pnpm >/dev/null 2>&1; then
              corepack enable 2>&1 | head -n 5
              corepack prepare pnpm@latest --activate 2>&1 | tail -n 2
            fi
          else
            echo "corepack 不可用，跳过"
          fi
          echo "pnpm : $(command -v pnpm || echo '不存在')"
          echo "yarn : $(command -v yarn || echo '不存在')"
          echo "::endgroup::"
          exit 0

      - name: Setup commands
        if: ${{ inputs.setup != '' }}
        shell: bash
        env:
          IN_SETUP: ${{ inputs.setup }}
          IN_SHELL: ${{ inputs.shell }}
        run: |
          set -euo pipefail
          case "${IN_SHELL:-bash}" in
            pwsh|powershell) ext=ps1 ;;
            python)          ext=py  ;;
            *)               ext=sh  ;;
          esac
          printf '%s\n' "$IN_SETUP" > "/tmp/br-setup.$ext"
          echo "--- setup ($IN_SHELL) ---"
          head -n 60 "/tmp/br-setup.$ext"
          echo "-------------------------"
          case "${IN_SHELL:-bash}" in
            pwsh|powershell) pwsh -NoProfile -File "/tmp/br-setup.ps1" ;;
            python)          python3 "/tmp/br-setup.py" 2>/dev/null || python "/tmp/br-setup.py" ;;
            *)               bash "/tmp/br-setup.sh" ;;
          esac

      # The wrapper is always bash (present on every hosted runner, including
      # Windows via Git Bash). It materializes the user command from an env var
      # — never by interpolating it into YAML — then hands it to the requested
      # interpreter, so quoting and heredocs inside the command stay intact.
      - name: Run command
        id: run
        shell: bash
        timeout-minutes: ${{ fromJSON(inputs.timeout_minutes) }}
        env:
          IN_COMMAND: ${{ inputs.command }}
          IN_SHELL: ${{ inputs.shell }}
        run: |
          set -uo pipefail
          case "${IN_SHELL:-bash}" in
            pwsh|powershell) ext=ps1 ;;
            python)          ext=py  ;;
            *)               ext=sh  ;;
          esac
          printf '%s\n' "$IN_COMMAND" > "/tmp/br-run.$ext"
          echo "--- build-runner echo of the command ---"
          head -n 60 "/tmp/br-run.$ext"
          echo "--- BUILD-RUNNER-OUTPUT-BEGIN ---"

          # Gradle only consults the build cache if told to. Rather than ask the
          # caller to remember `--build-cache` (and to keep repeat invocations
          # consistent), pass it through the environment where the wrapper
          # applies it. GRADLE_OPTS is honoured by every wrapper/CLI invocation
          # and does not rewrite the user's command text.
          #
          # `${GRADLE_OPTS:-}` matters: this step runs with `set -u`, so a bare
          # `$GRADLE_OPTS` aborts the whole step with "unbound variable" when the
          # variable was never set — which is the normal case.
          #
          # Also disable the daemon: the runner is ephemeral, so a daemon only
          # burns memory and can hold locks when the step ends.
          export GRADLE_OPTS="${GRADLE_OPTS:-} -Dorg.gradle.caching=true -Dorg.gradle.daemon=false"

          started=$SECONDS
          set +e
          case "${IN_SHELL:-bash}" in
            pwsh|powershell) pwsh -NoProfile -File "/tmp/br-run.ps1" ;;
            python)          python3 "/tmp/br-run.py" 2>/dev/null || python "/tmp/br-run.py" ;;
            *)               bash "/tmp/br-run.sh" ;;
          esac
          rc=$?
          set -e
          elapsed=$((SECONDS - started))

          echo ""
          echo "--- BUILD-RUNNER-OUTPUT-END ---"
          echo "BUILD-RUNNER-EXIT-CODE=$rc"
          echo "BUILD-RUNNER-DURATION-SECONDS=$elapsed"
          echo "BUILD-RUNNER-SHELL=$IN_SHELL"
          if [ "$rc" -ne 0 ]; then
            echo "build-runner: command failed with exit code $rc" >&2
          fi
          exit "$rc"

      # -------------------------------------------------------------- artifacts --
      - name: Upload artifacts
        if: ${{ always() && inputs.artifact_paths != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: build-runner-artifacts
          path: ${{ inputs.artifact_paths }}
          if-no-files-found: warn
          retention-days: 7

      # Always runs, so a caller can tell "the command failed" apart from
      # "the job died before the command ever started".
      - name: Report
        if: always()
        shell: bash
        env:
          TARGET_REPO: ${{ steps.t.outputs.repo }}
          TARGET_REF: ${{ steps.t.outputs.ref }}
          TARGET_SHA: ${{ steps.rev.outputs.short }}
          CMD_OUTCOME: ${{ steps.run.outcome }}
        run: |
          echo "================ BUILD-RUNNER-REPORT-V1 ================"
          echo "repo=$TARGET_REPO"
          echo "ref=$TARGET_REF"
          echo "sha=$TARGET_SHA"
          echo "command_outcome=$CMD_OUTCOME"
          echo "job_status=${{ job.status }}"
          echo "========================================================"
