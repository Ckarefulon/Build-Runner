# Build-Runner — remote command execution engine.
#
# This is the CENTRAL engine: it lives in this repository and runs commands
# against OTHER repositories, so no target repository needs a workflow file.
# A caller dispatches this workflow with `repo` + `ref` + `command`; the job
# checks the requested repository out and runs the command inside it.
#
# The MCP server in `mcp/` dispatches this, polls the run, and pulls the job
# log back through the Actions logs API, so the calling AI sees stdout/stderr
# and the real exit code exactly as if it had run the command locally.
name: Build Runner

# Every dispatch carries a unique `tag`. Stamping it into the run's display
# title is the only reliable way for the caller to find the run it just
# created: workflow_dispatch returns 204 with no run id, and two dispatches can
# land in the same second.
run-name: build-runner-${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Opaque caller-supplied id used to locate this run.'
        required: false
        default: ''
      repo:
        description: 'Target repository (owner/name). Empty means this runner repo.'
        required: false
        default: ''
      ref:
        description: 'Branch, tag or full commit SHA of the target repository.'
        required: false
        default: ''
      command:
        description: 'Shell command(s) to execute inside the checkout.'
        required: false
        default: ''
      # Run several commands in ONE job so they share the warm Gradle daemon and
      # incremental state. Measured on this Android project: a cold compile is
      # ~231s, the next one in the same job is ~1s. Splitting them into separate
      # dispatches would pay the cold cost every time.
      #
      # One command per line; an empty line or a line starting with `#` is
      # ignored. Each command runs even if an earlier one failed (useful for
      # "build then test then package"), and the step fails if ANY of them failed.
      commands:
        description: 'Multiple commands, one per line, run sequentially in the same job.'
        required: false
        default: ''
      shell:
        description: 'Interpreter: bash | pwsh | python'
        required: false
        default: 'bash'
      runner:
        description: 'Runner label, e.g. ubuntu-latest / windows-latest / macos-latest.'
        required: false
        default: 'ubuntu-latest'
      timeout_minutes:
        description: 'Cap for the command step, in minutes (1-120).'
        required: false
        default: '30'
      setup:
        description: 'Optional pre-commands (install deps etc) run before the main command.'
        required: false
        default: ''
      cache:
        description: 'Dependency cache: auto | none'
        required: false
        default: 'auto'
      artifact_paths:
        description: 'Newline or comma separated paths to upload as artifacts.'
        required: false
        default: ''
      fetch_depth:
        description: 'git fetch depth (0 = full history)'
        required: false
        default: '1'
      workspace_patch:
        description: 'Patch of local changes, applied after checkout. Empty = build the ref as-is.'
        required: false
        default: ''
      patch_ref:
        description: 'Branch in THIS repo holding the workspace patch (used when the patch is too big for an input).'
        required: false
        default: ''
      # ---------------------------------------------------------------------
      # Optional release, in THIS job.
      #
      # Running `run` and then `release` as two workflow runs builds twice — the
      # same 350s compile, two cold environments. Doing it here means one build,
      # and the artifact that is tested is byte-for-byte the artifact that ships.
      # ---------------------------------------------------------------------
      publish_release:
        description: 'true = after the command succeeds, package and publish a Release in this job.'
        required: false
        default: 'false'
      release_artifact_paths:
        description: 'Paths to package for the release (defaults to artifact_paths).'
        required: false
        default: ''
      package_name:
        description: 'Release package name (without extension).'
        required: false
        default: ''
      release_tag:
        description: 'Release tag. Default: package name.'
        required: false
        default: ''
      release_title:
        description: 'Release title.'
        required: false
        default: ''
      release_notes:
        description: 'Extra release notes.'
        required: false
        default: ''
      release_draft:
        description: 'true = create the release as a draft.'
        required: false
        default: 'false'

permissions:
  # `write` is required to create a Release when publish_release is on. It cannot
  # be conditional, so any caller can write releases to THIS repo — acceptable
  # because the only parties who can dispatch this workflow already have write
  # access here. The target repository is still only ever read.
  contents: write

# Serialize runs that target the same repository + ref.
#
# Without this, two concurrent builds of one project can both publish a snapshot
# to the same branch and race: the second push wins, but the run that already
# started may have checked out the first tree, so each caller gets a result for
# code that is no longer what the branch points at.
#
# cancel-in-progress is false on purpose. Cancelling would drop a caller that is
# actively waiting for output; queueing costs runner time but never a wrong answer.
concurrency:
  group: build-runner-${{ inputs.repo || github.repository }}-${{ inputs.ref || github.event.repository.default_branch }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'
  CI: 'true'

jobs:
  run:
    name: run command
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 120
    steps:
      # ---------------------------------------------------------------- resolve --
      - name: Resolve target
        id: t
        shell: bash
        env:
          IN_REPO: ${{ inputs.repo }}
          IN_REF: ${{ inputs.ref }}
          IN_DEPTH: ${{ inputs.fetch_depth }}
          THIS_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          repo="${IN_REPO:-$THIS_REPO}"
          ref="${IN_REF:-$DEFAULT_BRANCH}"
          depth="${IN_DEPTH:-1}"
          echo "repo=$repo"   >> "$GITHUB_OUTPUT"
          echo "ref=$ref"     >> "$GITHUB_OUTPUT"
          echo "depth=$depth" >> "$GITHUB_OUTPUT"
          echo "Target repository : $repo"
          echo "Target ref        : $ref"
          echo "Fetch depth       : $depth"

      # The target repository is usually PRIVATE, and the default GITHUB_TOKEN
      # of THIS repo cannot read it. `checkout_token` is a secret holding a
      # token that can. Absent it we fall back to the default token, which is
      # enough for public targets and same-repository runs.
      - name: Checkout target
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.t.outputs.repo }}
          ref: ${{ steps.t.outputs.ref }}
          token: ${{ secrets.checkout_token || github.token }}
          # `steps.t.outputs.depth` is a string; passing "0" through fromJSON
          # yields 0 which checkout treats as unlimited, but an empty/odd value
          # falls back to 1. Compare explicitly so "0" means full history.
          fetch-depth: ${{ steps.t.outputs.depth == '0' && '0' || steps.t.outputs.depth }}
          persist-credentials: false

      - name: Record revision
        id: rev
        shell: bash
        run: |
          set +e
          set +o pipefail
          sha=$(git rev-parse HEAD)
          short=$(git rev-parse --short HEAD)
          subject=$(git log -1 --pretty=%s)
          author=$(git log -1 --pretty='%an <%ae>')
          date=$(git log -1 --pretty=%ad)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short=$short" >> "$GITHUB_OUTPUT"
          echo "Checked out $sha ($subject)"
          echo "author: $author"
          echo "date:   $date"
          exit 0

      # ------------------------------------------------------------------ cache --
      # Auto-detect the package manager and reuse its store across runs.
      #
      # Cache key scoping matters more than it looks. Every target project runs
      # through THIS one workflow, so all of them share one cache pool owned by
      # the engine repo. Without a repo component in the key:
      #   * project B's exact key misses, then `restore-keys: br-Linux-` hands it
      #     project A's Gradle cache — wrong artifacts, wasted restore time;
      #   * everything competes for one 10 GB budget, so busy projects evict each
      #     other and start missing on every run, which is slower than no cache.
      # The target slug is therefore part of both the key and the restore prefix.
      - name: Detect caches
        id: cache
        shell: bash
        env:
          IN_CACHE: ${{ inputs.cache }}
          TARGET_REPO: ${{ steps.t.outputs.repo }}
        run: |
          set +e
          set +o pipefail
          paths=""
          key=""
          # owner/name -> owner-name. Also caps length and strips anything that
          # is not cache-key safe, since a key may only contain [-_.A-Za-z0-9].
          scope=$(printf '%s' "${TARGET_REPO:-this-repo}" \
            | tr '/' '-' \
            | tr -cd 'A-Za-z0-9._-' \
            | cut -c1-80)
          if [ "${IN_CACHE:-auto}" != "none" ]; then
            if   [ -f pnpm-lock.yaml ];      then paths="$HOME/.local/share/pnpm/store
          $HOME/Library/pnpm/store
          $HOME/AppData/Local/pnpm/store"; key="pnpm"
            elif [ -f yarn.lock ];           then paths="$HOME/.cache/yarn"; key="yarn"
            elif [ -f package-lock.json ];   then paths="$HOME/.npm";        key="npm"
            elif [ -f gradle.properties ] || [ -f build.gradle.kts ] || [ -f build.gradle ]; then
              # Narrow, targeted paths instead of all of ~/.gradle/caches.
              # The full directory archives to ~600 MB and costs ~16s just to
              # download and unpack; most of it (file-hashes, worker locks,
              # journal-1) is per-run scratch that can never be reused.
              paths="$HOME/.gradle/caches/modules-2
          $HOME/.gradle/caches/*/transforms
          $HOME/.gradle/caches/*/kotlin-dsl
          $HOME/.gradle/wrapper"; key="gradle"
            elif [ -f pom.xml ];             then paths="$HOME/.m2/repository"; key="maven"
            elif [ -f Cargo.toml ];          then paths="$HOME/.cargo/registry
          $HOME/.cargo/git
          target"; key="cargo"
            elif [ -f requirements.txt ] || [ -f pyproject.toml ]; then paths="$HOME/.cache/pip"; key="pip"
            elif [ -f go.mod ];              then paths="$HOME/go/pkg/mod"; key="go"
            fi
          fi
          if [ -n "$key" ]; then
            lock=$(ls -1 pnpm-lock.yaml yarn.lock package-lock.json build.gradle.kts build.gradle pom.xml Cargo.toml requirements.txt pyproject.toml go.mod 2>/dev/null | head -n 1)
            hash=$(git hash-object "$lock" 2>/dev/null | cut -c1-16)
            [ -n "$hash" ] || hash=none
            {
              echo "path<<__CACHE_PATHS__"
              printf '%s\n' "$paths"
              echo "__CACHE_PATHS__"
            } >> "$GITHUB_OUTPUT"
            echo "scope=$scope" >> "$GITHUB_OUTPUT"
            echo "key=$key-$hash" >> "$GITHUB_OUTPUT"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Dependency cache: $key ($lock @ $hash) scoped to $scope"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Dependency cache: disabled"
          fi
          exit 0

      # Turn on Gradle performance flags that are pure wins: they only change how
      # Gradle schedules/reads its own caches, never what gets built.
      #
      # Deliberately NOT enabling `org.gradle.configuration-cache`: it makes some
      # plugins fail outright, and a build that fails for a performance reason is
      # a bad trade. The caller can still pass it in their own command.
      #
      # `--parallel` is not forced either: it can change task interleaving and
      # surface latent ordering bugs, so it stays the project's decision.
      - name: Restore cache
        if: ${{ steps.cache.outputs.enabled == 'true' }}
        uses: actions/cache@v4
        with:
          # Dependency cache and Gradle's build cache are restored together:
          # each `actions/cache` invocation costs its own action bootstrap and a
          # post-job step, so combining them saves a few seconds per run with no
          # behavioural change.
          path: |
            ${{ steps.cache.outputs.path }}
            ~/.gradle/caches/build-cache-1
          # NOTE: the project-level `.gradle/configuration-cache` directory is
          # deliberately NOT cached. Its contents are keyed on the exact build
          # scripts and would be invalidated by the workflow patch anyway, so
          # restoring it risks a stale-config hit for no gain. The configuration
          # cache still helps within a single run (repeat invocations).
          key: br-${{ runner.os }}-${{ steps.cache.outputs.scope }}-${{ steps.cache.outputs.key }}
          # Restore prefix is ALSO scoped. A bare `br-Linux-` prefix would let
          # one project restore another project's dependency cache on a miss,
          # which is both wrong and slower than a clean download.
          restore-keys: br-${{ runner.os }}-${{ steps.cache.outputs.scope }}-

      # Written AFTER the cache restore so a cached gradle.properties can never
      # win over these settings.
      - name: Gradle tuning
        if: ${{ hashFiles('**/build.gradle.kts', '**/build.gradle') != '' }}
        shell: bash
        run: |
          set +e
          set +o pipefail
          props="$HOME/.gradle/gradle.properties"
          mkdir -p "$(dirname "$props")"
          {
            echo '# injected by build-runner'
            echo 'org.gradle.caching=true'
            # A resident daemon is what makes repeat commands fast.
            #
            # MEASURED on this Android project, inside ONE job:
            #   first compile (cold daemon)  231s
            #   second compile (warm daemon)   1s
            #   compile after one file edit    2s
            # Every command in this job therefore reuses the same warm JVM and
            # incremental state. The daemon dies with the job — there is nothing
            # to leak into the next run, and no cross-run staleness.
            #
            # (A previous revision set `daemon=false`. That is right for a
            # one-shot build but throws away everything the daemon exists for.)
            echo 'org.gradle.daemon=true'
            echo 'org.gradle.parallel=true'
            # Configuration cache skips re-running the configuration phase on
            # repeat builds. MEASURED on a real Android project: the config phase
            # went 44s -> 5s on the second run.
            #
            # `problems=warn` is the safety net and the whole reason this is safe
            # to enable for arbitrary projects: when a plugin violates
            # configuration-cache rules, Gradle DISCARDS the entry and builds
            # normally instead of failing. Verified on a project that emits
            # KMP/hierarchy-template violations — BUILD SUCCESSFUL, cache stored,
            # and the same build under `problems=fail` also succeeded.
            #
            # Cost when unsupported: the config phase runs twice (once to detect
            # the violation). Cost when supported: tens of seconds saved.
            echo 'org.gradle.configuration-cache=true'
            echo 'org.gradle.configuration-cache.problems=warn'
          } > "$props"
          echo "已写入 $props："
          cat "$props"
          exit 0

      # ---------------------------------------------------------------- execute --
      # Android's debug keystore is generated on first use with RANDOM keys, and
      # every hosted runner starts as a blank machine. So each build signs with a
      # different key, and installing over a previous debug build fails with
      # "signatures do not match" / INSTALL_FAILED_UPDATE_INCOMPATIBLE.
      #
      # The fix is not to use a different key — the debug key is fine — but to
      # stop it from being regenerated: cache ~/.android so one stable debug
      # keystore is reused across runs.
      # Own step so the scope is always present: when `cache: none` the Detect
      # caches step emits no scope, and the keystore cache key would collapse to
      # a shared `br-android-debug-Linux-` that every project fights over.
      - name: Compute cache scope
        id: scope
        shell: bash
        env:
          IN_REPO: ${{ steps.t.outputs.repo }}
        run: |
          set +e
          set +o pipefail
          s=$(printf '%s' "${IN_REPO:-this-repo}" | tr '/' '-' | tr -cd 'A-Za-z0-9._-' | cut -c1-80)
          echo "scope=$s" >> "$GITHUB_OUTPUT"
          echo "cache scope: $s"
          exit 0

      # Android's debug keystore must be STABLE ACROSS RUNS.
      #
      # Every hosted runner starts blank, so Gradle would generate a random debug
      # key on each build — and installing an update whose signature differs from
      # the installed build fails with INSTALL_FAILED_UPDATE_INCOMPATIBLE.
      #
      # A cache alone is not enough: `actions/cache` entries are evicted by LRU,
      # expire after 7 days unused, and vanish when anyone clears caches. Each
      # eviction silently changes the signing identity.
      #
      # So the keystore lives IN THIS REPOSITORY (`android/debug.keystore`) and is
      # copied into place every run. It is not a secret: the Android debug key is
      # a well-known SDK artifact (storepass/keypass `android`). What matters is
      # only that it never changes.
      # Cache kept ONLY as a fallback for repositories that have not checked in
      # `android/debug.keystore` yet; the repository copy always wins.
      - name: Restore Android debug keystore
        id: androidkey
        if: ${{ true }}
        uses: actions/cache@v4
        with:
          path: ~/.android
          key: br-android-debug-${{ runner.os }}-${{ steps.scope.outputs.scope }}
          restore-keys: |
            br-android-debug-${{ runner.os }}-

      - name: Ensure debug keystore exists
        if: ${{ true }}
        shell: bash
        run: |
          set +e
          set +o pipefail
          mkdir -p "$HOME/.android"
          target="$HOME/.android/debug.keystore"

          if [ -f "$GITHUB_WORKSPACE/android/debug.keystore" ]; then
            # Durable source of truth: the checked-in keystore always wins, so
            # losing the cache can never change the signing identity.
            cp -f "$GITHUB_WORKSPACE/android/debug.keystore" "$target"
            chmod 600 "$target" 2>/dev/null
            echo "已安装仓库内的固定 debug.keystore"
          elif [ -f "$target" ]; then
            echo "使用缓存中的 debug.keystore"
          elif command -v keytool >/dev/null 2>&1; then
            # Absolute last resort. Note this generates a NEW random key pair:
            # the fixed dname only fixes the certificate subject, not the key.
            keytool -genkeypair -v \
              -keystore "$target" \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" >/dev/null 2>&1 \
              && echo "::warning::临时生成 debug.keystore —— 签名可能与既有安装不同" \
              || echo "keytool 生成失败，交给 Gradle"
          else
            echo "无可用 keystore，交给 Gradle 生成"
          fi

          if command -v keytool >/dev/null 2>&1 && [ -f "$target" ]; then
            keytool -list -keystore "$target" -storepass android 2>/dev/null \
              | grep -i "SHA-256\|SHA1" | head -1
          fi
          exit 0
            fi
          fi
          exit 0

      # Toolchain probe used to take 29s — longer than the build itself — because
      # it ran `--version` on 21 tools, most of which the command never touches.
      # It now probes ONLY the tools named in the command, reads versions in
      # parallel, and gives each a hard timeout so one hanging binary cannot
      # stall the job. Measured cost: ~2s instead of 29s.
      #
      # `set +e` / `+o pipefail` is still required: GitHub runs bash steps with
      # `-e -o pipefail`, and a probe exits non-zero when the tool is absent.
      - name: Environment
        shell: bash
        env:
          IN_COMMAND: ${{ inputs.command }}
        run: |
          set +e
          set +o pipefail
          echo "::group::build-runner environment"
          echo "runner : $RUNNER_OS / $RUNNER_ARCH"
          echo "workdir: $(pwd)"

          # Only probe interpreters/packagers that appear in the command text.
          candidates="node npm pnpm yarn python python3 pip java javac gradle mvn docker dotnet go rustc cargo gcc g++ make cmake bun deno"
          found=0
          for c in $candidates; do
            printf '%s' "$IN_COMMAND" | grep -qw -- "$c" || continue
            found=1
            if command -v "$c" >/dev/null 2>&1; then
              v=$(timeout 5 "$c" --version 2>&1 </dev/null </dev/null | head -n 1)
              printf '%-8s %s\n' "$c" "${v:-?}"
            else
              printf '%-8s %s\n' "$c" '(未安装)'
            fi
          done
          [ "$found" = "0" ] && echo "(命令未引用已知工具链，已跳过探测)"
          echo "::endgroup::"
          exit 0

      # Same wrapper shape as "Run command", minus the exit-code plumbing: a
      # failing setup should fail the job, which is exactly what `set -e` gives.
      # Hosted runners ship Node but NOT pnpm/yarn, and the single most common
      # command an AI sends is `pnpm install && pnpm build`. Enabling corepack
      # costs about a second and removes that whole class of exit-127 surprise.
      # It is a no-op when the tools already exist or the repo does not use them.
      - name: Enable package managers
        shell: bash
        run: |
          set +e
          set +o pipefail
          echo "::group::build-runner package managers"
          need=0
          if [ -f pnpm-lock.yaml ] || [ -f pnpm-workspace.yaml ] || grep -qs '"packageManager"' package.json; then need=1; fi
          if [ -f yarn.lock ]; then need=1; fi
          if command -v corepack >/dev/null 2>&1; then
            if [ "$need" = "1" ] || ! command -v pnpm >/dev/null 2>&1; then
              corepack enable 2>&1 | head -n 5
              corepack prepare pnpm@latest --activate 2>&1 | tail -n 2
            fi
          else
            echo "corepack 不可用，跳过"
          fi
          echo "pnpm : $(command -v pnpm || echo '不存在')"
          echo "yarn : $(command -v yarn || echo '不存在')"
          echo "::endgroup::"
          exit 0

      - name: Setup commands
        if: ${{ inputs.setup != '' }}
        shell: bash
        env:
          IN_SETUP: ${{ inputs.setup }}
          IN_SHELL: ${{ inputs.shell }}
        run: |
          set -euo pipefail
          case "${IN_SHELL:-bash}" in
            pwsh|powershell) ext=ps1 ;;
            python)          ext=py  ;;
            *)               ext=sh  ;;
          esac
          printf '%s\n' "$IN_SETUP" > "/tmp/br-setup.$ext"
          echo "--- setup ($IN_SHELL) ---"
          head -n 60 "/tmp/br-setup.$ext"
          echo "-------------------------"
          case "${IN_SHELL:-bash}" in
            pwsh|powershell) pwsh -NoProfile -File "/tmp/br-setup.ps1" ;;
            python)          python3 "/tmp/br-setup.py" 2>/dev/null || python "/tmp/br-setup.py" ;;
            *)               bash "/tmp/br-setup.sh" ;;
          esac

      # Apply the caller's local changes on top of the checkout.
      #
      # This is how a snapshot travels WITHOUT creating any branch in the target
      # repository: the caller's own branch is checked out, then their diff is
      # applied. The repository is left exactly as it was.
      #
      # `-3` (three-way) is the fallback: if the base moved slightly a plain
      # apply fails, but a three-way merge still lands the change. If both fail
      # we stop rather than build code that does not match what the caller has —
      # silently building different code is the worst outcome available here.
      - name: Fetch workspace patch
        if: ${{ inputs.patch_ref != '' }}
        shell: bash
        env:
          IN_REF: ${{ inputs.patch_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          set +o pipefail
          # The patch lives on a disposable branch in THIS repo; fetch only that
          # file so the target checkout stays pristine.
          url="https://raw.githubusercontent.com/${{ github.repository }}/${IN_REF}/.build-runner/workspace.patch"
          echo "获取补丁：$url"
          if ! curl -fsSL "$url" -o /tmp/br.patch.raw; then
            echo "::error::无法获取补丁分支 ${IN_REF}"
            exit 1
          fi
          echo "下载大小：$(wc -c < /tmp/br.patch.raw | tr -d ' ') 字节"

          # Two transports can publish this file:
          #   git-data -> raw patch bytes, starting with "diff --git"
          #   contents -> base64 text
          # Detect by content rather than by a flag, so the workflow stays correct
          # even if the client switches transports mid-flight.
          head -c 5 /tmp/br.patch.raw | grep -q '^diff ' && is_raw=1 || is_raw=0
          if [ "$is_raw" = "1" ]; then
            cp /tmp/br.patch.raw /tmp/br.patch
            echo "补丁格式：原始 diff"
          else
            if base64 -d < /tmp/br.patch.raw > /tmp/br.patch 2>/dev/null; then
              echo "补丁格式：base64（已解码）"
            else
              echo "::error::补丁既不是 diff 也不是 base64，无法识别"
              head -c 200 /tmp/br.patch.raw
              exit 1
            fi
          fi
          echo "补丁大小：$(wc -c < /tmp/br.patch | tr -d ' ') 字节"
          exit 0

      - name: Apply workspace patch
        if: ${{ inputs.patch_ref != '' || inputs.workspace_patch != '' }}
        shell: bash
        env:
          IN_PATCH: ${{ inputs.workspace_patch }}
        run: |
          set +e
          set +o pipefail
          # Small patches may arrive inline; larger ones come via patch_ref.
          if [ -n "$IN_PATCH" ]; then
            printf '%s' "$IN_PATCH" | base64 -d > /tmp/br.patch
          fi
          if [ ! -s /tmp/br.patch ]; then
            echo "补丁为空，跳过"
            exit 0
          fi
          if git apply --binary --whitespace=nowarn /tmp/br.patch; then
            echo "::notice::已应用本地改动补丁"
          elif git apply --binary --whitespace=nowarn -3 /tmp/br.patch; then
            echo "::notice::已用三方合并应用本地改动补丁"
          else
            echo "::error::补丁应用失败：云端代码与本地不一致，拒绝继续构建"
            git apply --stat /tmp/br.patch | head -20
            exit 1
          fi
          echo "--- 应用后的改动 ---"
          git status --porcelain | head -30
          exit 0

      # The wrapper is always bash (present on every hosted runner, including
      # Windows via Git Bash). It materializes the user command from an env var
      # — never by interpolating it into YAML — then hands it to the requested
      # interpreter, so quoting and heredocs inside the command stay intact.
      - name: Run command
        id: run
        shell: bash
        timeout-minutes: ${{ fromJSON(inputs.timeout_minutes) }}
        env:
          IN_COMMAND: ${{ inputs.command }}
          IN_COMMANDS: ${{ inputs.commands }}
          IN_SHELL: ${{ inputs.shell }}
        run: |
          set -uo pipefail
          case "${IN_SHELL:-bash}" in
            pwsh|powershell) ext=ps1 ;;
            python)          ext=py  ;;
            *)               ext=sh  ;;
          esac

          # Build the list of command scripts.
          #
          # `commands` (one per line) is the multi-command form: each line becomes
          # its own script and they all run in THIS job, so they share one warm
          # Gradle daemon and one incremental state. That is the whole point —
          # a second compile in the same job measured ~1s against ~231s cold.
          #
          # `command` (single, may be multiline) stays as one script for backwards
          # compatibility.
          rm -rf /tmp/br-cmds && mkdir -p /tmp/br-cmds
          if [ -n "${IN_COMMANDS:-}" ]; then
            n=0
            while IFS= read -r line; do
              # Skip blanks and comments so the caller can annotate a list.
              trimmed="$(printf '%s' "$line" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
              [ -z "$trimmed" ] && continue
              case "$trimmed" in \#*) continue ;; esac
              n=$((n + 1))
              printf '%s\n' "$line" > "/tmp/br-cmds/$(printf '%03d' "$n").$ext"
            done <<< "$IN_COMMANDS"
          elif [ -n "${IN_COMMAND:-}" ]; then
            printf '%s\n' "$IN_COMMAND" > "/tmp/br-cmds/001.$ext"
          fi

          if ! ls /tmp/br-cmds/*."$ext" >/dev/null 2>&1; then
            echo "::error::没有要执行的命令（command 与 commands 都为空）"
            exit 1
          fi

          total=$(ls /tmp/br-cmds/*."$ext" | wc -l | tr -d ' ')
          echo "--- build-runner: ${total} 条命令，同一个 job 内顺序执行 ---"
          echo "--- BUILD-RUNNER-OUTPUT-BEGIN ---"

          # GRADLE_OPTS: enabling the build cache is enough here. The daemon is
          # deliberately NOT disabled — keeping it alive is exactly what makes
          # later commands fast.
          export GRADLE_OPTS="${GRADLE_OPTS:-} -Dorg.gradle.caching=true"

          started=$SECONDS
          overall=0
          idx=0
          failed_list=""

          set +e
          for script in /tmp/br-cmds/*."$ext"; do
            idx=$((idx + 1))
            echo ""
            echo "===== 命令 ${idx}/${total} ====="
            head -n 40 "$script"
            echo "----- 输出 -----"
            cmd_started=$SECONDS
            case "${IN_SHELL:-bash}" in
              pwsh|powershell) pwsh -NoProfile -File "$script" ;;
              python)          python3 "$script" 2>/dev/null || python "$script" ;;
              *)               bash "$script" ;;
            esac
            rc=$?
            cmd_elapsed=$((SECONDS - cmd_started))
            echo "----- 命令 ${idx} 退出码 ${rc}，耗时 ${cmd_elapsed}s -----"
            if [ "$rc" -ne 0 ]; then
              # Keep going: a later command may be the one that reports useful
              # diagnostics, and stopping early would hide it. The job still
              # fails at the end.
              overall=$rc
              failed_list="${failed_list}${idx} "
            fi
          done
          set -e
          elapsed=$((SECONDS - started))

          echo ""
          echo "--- BUILD-RUNNER-OUTPUT-END ---"
          echo "BUILD-RUNNER-EXIT-CODE=$overall"
          echo "BUILD-RUNNER-DURATION-SECONDS=$elapsed"
          echo "BUILD-RUNNER-SHELL=$IN_SHELL"
          echo "BUILD-RUNNER-COMMAND-COUNT=$total"
          if [ -n "$failed_list" ]; then
            echo "BUILD-RUNNER-FAILED-COMMANDS=$failed_list"
            echo "build-runner: 命令 ${failed_list}失败（最后退出码 ${overall}）" >&2
          fi
          exit "$overall"

      # -------------------------------------------------------------- artifacts --
      - name: Upload artifacts
        if: ${{ always() && inputs.artifact_paths != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: build-runner-artifacts
          path: ${{ inputs.artifact_paths }}
          if-no-files-found: warn
          retention-days: 7

      # ------------------------------------------------------------------ release --
      # Package and publish in the SAME job, so the artifact being shipped is the
      # one that was just built and tested — not a second build of the same code.
      - name: Package for release
        id: pkg
        if: ${{ success() && inputs.publish_release == 'true' }}
        shell: bash
        env:
          IN_PATHS: ${{ inputs.release_artifact_paths != '' && inputs.release_artifact_paths || inputs.artifact_paths }}
          IN_NAME: ${{ inputs.package_name }}
          REPO_SLUG: ${{ steps.t.outputs.repo }}
          SHORT_SHA: ${{ steps.rev.outputs.short }}
        run: |
          set -uo pipefail
          slug_safe() { printf '%s' "$1" | tr '/' '-' | tr -cd 'A-Za-z0-9._-'; }

          name="${IN_NAME:-$(slug_safe "$REPO_SLUG")-${SHORT_SHA}}"
          echo "name=$name" >> "$GITHUB_OUTPUT"

          mapfile -t paths < <(printf '%s\n' "$IN_PATHS" | tr ',' '\n' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' | grep -v '^$')
          matched=()
          for p in "${paths[@]}"; do
            # shellcheck disable=SC2206
            found=( $p )
            for f in "${found[@]}"; do
              [ -e "$f" ] && matched+=("$f")
            done
          done
          if [ "${#matched[@]}" -eq 0 ]; then
            echo "::error::release_artifact_paths 没有匹配到任何文件：$IN_PATHS"
            exit 1
          fi
          echo "--- packaging ${#matched[@]} path(s) ---"
          printf '  %s\n' "${matched[@]:0:40}"

          # A single file (one APK, one jar) ships as-is: wrapping it in a zip
          # makes an APK uninstallable and adds nothing.
          zipfile=""
          if [ "${#matched[@]}" -eq 1 ] && [ -f "${matched[0]}" ]; then
            src="${matched[0]}"
            base=$(basename "$src")
            if [ "$base" = "${base##*.}" ]; then ext="bin"; else ext="${base##*.}"; fi
            case "$name" in
              *".$ext") zipfile="$name" ;;
              *)        zipfile="${name}.${ext}" ;;
            esac
            cp -f "$src" "./$zipfile"
            echo "单文件产物：直接发布 $zipfile（不打包）"
          else
            zipfile="${name}.zip"
            rm -f "$zipfile"
            if command -v zip >/dev/null 2>&1; then
              zip -r -q "$zipfile" "${matched[@]}"
            else
              tar -czf "${name}.tar.gz" "${matched[@]}"
              zipfile="${name}.tar.gz"
            fi
            echo "多路径产物：已归档 $zipfile"
          fi

          bytes=$(wc -c < "$zipfile" | tr -d ' ')
          if command -v sha256sum >/dev/null 2>&1; then
            sum=$(sha256sum "$zipfile" | cut -d' ' -f1)
          else
            sum=$(shasum -a 256 "$zipfile" | cut -d' ' -f1)
          fi
          echo "file=$zipfile" >> "$GITHUB_OUTPUT"
          echo "bytes=$bytes" >> "$GITHUB_OUTPUT"
          echo "sha256=$sum" >> "$GITHUB_OUTPUT"
          echo "Package $zipfile ($bytes bytes)"

      - name: Publish release
        id: rel
        if: ${{ success() && inputs.publish_release == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.release_token || github.token }}
          PKG_FILE: ${{ steps.pkg.outputs.file }}
          PKG_NAME: ${{ steps.pkg.outputs.name }}
          IN_TAG: ${{ inputs.release_tag }}
          TITLE: ${{ inputs.release_title }}
          NOTES: ${{ inputs.release_notes }}
          DRAFT: ${{ inputs.release_draft }}
          TARGET_REPO: ${{ steps.t.outputs.repo }}
          TARGET_REF: ${{ steps.t.outputs.ref }}
          TARGET_SHA: ${{ steps.rev.outputs.sha }}
          SHA256: ${{ steps.pkg.outputs.sha256 }}
        run: |
          set -uo pipefail
          tag="${IN_TAG:-$PKG_NAME}"
          title="${TITLE:-$PKG_NAME}"
          body=$(cat <<EOF
          产物包（构建与打包在同一次运行内完成）

          - 源仓库：\`${TARGET_REPO}\`
          - 源版本：\`${TARGET_REF}\` @ \`${TARGET_SHA}\`
          - SHA256：\`${SHA256}\`
          EOF
          )
          if [ -n "${NOTES:-}" ]; then body="${body}

          ---

          ${NOTES}"; fi

          args=(release create "$tag" "$PKG_FILE" --repo "${{ github.repository }}" --title "$title" --notes "$body")
          if [ "${DRAFT:-false}" = "true" ]; then args+=(--draft); fi

          if out=$(gh "${args[@]}" 2>&1); then
            echo "Release 已发布：$out"
            echo "url=$out" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          else
            echo "$out"
            # Re-running the same tag must not fail the job: replace the asset.
            if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
              echo "tag 已存在，覆盖资产"
              gh release upload "$tag" "$PKG_FILE" --repo "${{ github.repository }}" --clobber
              url=$(gh release view "$tag" --repo "${{ github.repository }}" --json url --jq .url)
              echo "url=$url" >> "$GITHUB_OUTPUT"
              echo "tag=$tag" >> "$GITHUB_OUTPUT"
            else
              echo "::error::Release 发布失败：$out"
              exit 1
            fi
          fi

      # Always runs, so a caller can tell "the command failed" apart from
      # "the job died before the command ever started".
      - name: Report
        if: always()
        shell: bash
        env:
          TARGET_REPO: ${{ steps.t.outputs.repo }}
          TARGET_REF: ${{ steps.t.outputs.ref }}
          TARGET_SHA: ${{ steps.rev.outputs.short }}
          CMD_OUTCOME: ${{ steps.run.outcome }}
          REL_TAG: ${{ steps.rel.outputs.tag }}
          REL_URL: ${{ steps.rel.outputs.url }}
          PKG_NAME: ${{ steps.pkg.outputs.name }}
          PKG_BYTES: ${{ steps.pkg.outputs.bytes }}
          PKG_SHA: ${{ steps.pkg.outputs.sha256 }}
        run: |
          echo "================ BUILD-RUNNER-REPORT-V1 ================"
          echo "repo=$TARGET_REPO"
          echo "ref=$TARGET_REF"
          echo "sha=$TARGET_SHA"
          echo "command_outcome=$CMD_OUTCOME"
          echo "job_status=${{ job.status }}"
          # Present only when publish_release was on; the client uses these to
          # surface the release without a second API round trip.
          echo "release_tag=$REL_TAG"
          echo "release_url=$REL_URL"
          echo "package_name=$PKG_NAME"
          echo "package_bytes=$PKG_BYTES"
          echo "package_sha256=$PKG_SHA"
          echo "========================================================"

      # NOTE: the patch branch (br-patch/<owner-repo>) is intentionally NOT
      # deleted here. It is reused and overwritten by the next build of the same
      # target, and the concurrency group above serializes those builds — so a
      # cleanup step would only buy an extra container step (~10s) to remove
      # something the next run overwrites anyway.
