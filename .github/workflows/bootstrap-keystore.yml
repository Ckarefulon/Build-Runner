# Generate the durable Android debug keystore and commit it to this repo.
#
# Why this exists: the debug signing identity must never change, but
# `actions/cache` entries are evicted by LRU, expire after 7 days unused, and are
# cleared by anyone running "clear caches". Every eviction would silently change
# the signature, and installing an update over an existing debug build would then
# fail with INSTALL_FAILED_UPDATE_INCOMPATIBLE.
#
# A debug keystore is NOT a secret: it is the well-known Android debug key
# (storepass/keypass `android`, alias `androiddebugkey`). Committing it is the
# standard way to keep the identity stable across ephemeral runners.
#
# Run once, then this workflow can be deleted.
name: Bootstrap debug keystore

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate keystore
        run: |
          set -euo pipefail
          mkdir -p android
          ks=android/debug.keystore
          if [ -f "$ks" ]; then
            echo "已存在，跳过生成"
          else
            keytool -genkeypair -v \
              -keystore "$ks" \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          echo "--- 指纹 ---"
          keytool -list -keystore "$ks" -storepass android | grep -iE "SHA-256|SHA1" || true
          echo "--- 大小 ---"
          wc -c "$ks"

      - name: Commit keystore
        run: |
          set -euo pipefail
          git config user.email "build-runner@users.noreply.github.com"
          git config user.name "build-runner"
          git add -f android/debug.keystore
          if git diff --cached --quiet; then
            echo "没有变化"
            exit 0
          fi
          git commit -m "chore: add durable android debug keystore"
          git push
