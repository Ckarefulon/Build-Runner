# Build-Runner — resident session.
#
# Starts ONE job that stays alive with a warm build environment and executes
# commands handed to it one at a time, so an agent can inspect output before
# choosing the next command.
#
# Why: a fresh `run` dispatch pays the cold cost every time. MEASURED on this
# Android project: first compile 290s, then 2s and 1s for the next two in the same
# job. Reusing that environment ACROSS tool calls is the whole point.
#
# Transport: a GitHub issue. Each command is a comment, each result is a comment.
# Comments are append-only, so the caller and the runner never contend for a ref,
# and nothing is written to git history.
#
# Hard limits, stated plainly:
#   - one job may live at most 6 hours, so a session cannot exceed that
#   - the workspace is destroyed when the job ends
name: Build Runner Session

run-name: build-runner-session-${{ inputs.session }}

on:
  workflow_dispatch:
    inputs:
      session:
        description: 'Caller-chosen session id.'
        required: true
      issue:
        description: 'Issue number used as the command/result channel.'
        required: true
      repo:
        description: 'Target repository (owner/name).'
        required: true
      ref:
        description: 'Branch/tag/SHA of the target repository.'
        required: false
        default: ''
      shell:
        description: 'Interpreter: bash | pwsh | python'
        required: false
        default: 'bash'
      setup:
        description: 'Commands run once before serving (install deps etc).'
        required: false
        default: ''
      runner:
        description: 'Runner label.'
        required: false
        default: 'ubuntu-latest'
      timeout_minutes:
        description: 'Max session lifetime in minutes (job cap is 6h).'
        required: false
        default: '120'
      idle_seconds:
        description: 'End the session after this long with no commands.'
        required: false
        default: '900'
      workspace_patch:
        description: 'Patch applied after checkout (same format as run.yml).'
        required: false
        default: ''
      patch_ref:
        description: 'Branch holding the workspace patch when too large for an input.'
        required: false
        default: ''
      fetch_depth:
        description: 'git fetch depth (0 = full history).'
        required: false
        default: '0'
      emulator:
        description: >-
          Boot an Android emulator in this session. JSON, e.g.
          {"api":34,"arch":"x86_64","profile":"pixel_7","image":"google_apis"}.
          Empty = no emulator.
        required: false
        default: ''

permissions:
  # `write` is needed for one thing only: uploading screenshots. A 1080x2400 PNG
  # is ~1.4 MB, far past the 65,536-character issue-comment limit, so it is
  # committed to this repo and only its path is posted back.
  contents: write
  issues: write

concurrency:
  group: build-runner-session-${{ inputs.session }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: '1'
  CI: 'true'

jobs:
  session:
    name: resident session
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ fromJSON(inputs.timeout_minutes) }}
    steps:
      # The engine repo is needed twice: the session runner script lives here, and
      # a checked-in debug keystore (when present) must be installed.
      - name: Checkout engine
        uses: actions/checkout@v4
        with:
          path: engine
          fetch-depth: 1

      - name: Checkout target
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.checkout_token || github.token }}
          path: work
          fetch-depth: ${{ inputs.fetch_depth == '0' && '0' || inputs.fetch_depth }}
          persist-credentials: false

      # ---------------------------------------------------------------- cache --
      # Without these, every session starts from zero: re-download all Gradle
      # dependencies, re-install the emulator, cold-boot it. Caching is what makes
      # a session feel "already running" even when it was started minutes ago on a
      # brand-new VM.
      #
      # Scope is per target repo so two projects cannot fight over one entry.
      - name: Compute cache scope
        id: scope
        shell: bash
        env:
          IN_REPO: ${{ inputs.repo }}
          IN_EMULATOR: ${{ inputs.emulator }}
        run: |
          set +e
          set +o pipefail
          s=$(printf '%s' "${IN_REPO:-this-repo}" | tr '/' '-' | tr -cd 'A-Za-z0-9._-' | cut -c1-80)
          echo "scope=$s" >> "$GITHUB_OUTPUT"
          echo "cache scope: $s"

          # Cache keys may not contain commas, and the emulator input is JSON
          # (`{"api":34,...}`) — so sanitize it into a plain token. Using the raw
          # JSON failed with "Key Validation Error: ... cannot contain commas".
          e=$(printf '%s' "${IN_EMULATOR:-none}" | tr -cd 'A-Za-z0-9._-' | cut -c1-60)
          [ -z "$e" ] && e=none
          echo "emu=$e" >> "$GITHUB_OUTPUT"
          echo "emulator cache key part: $e"
          exit 0

      - name: Restore Gradle caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/notifications
          key: br-session-gradle-${{ runner.os }}-${{ steps.scope.outputs.scope }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            br-session-gradle-${{ runner.os }}-${{ steps.scope.outputs.scope }}-
            br-session-gradle-${{ runner.os }}-

      - name: Restore Android SDK pieces
        if: ${{ inputs.emulator != '' }}
        uses: actions/cache@v4
        with:
          # The SDK lives outside the workspace, and `actions/cache` refuses
          # absolute paths outside it ("Path Validation Error"). Cache a staging
          # directory inside the workspace, then copy it into place.
          path: .ci-cache/android-sdk
          key: br-emu-sdk-${{ runner.os }}-${{ steps.scope.outputs.emu }}

      - name: Install Android SDK pieces into place
        if: ${{ inputs.emulator != '' }}
        shell: bash
        run: |
          set +e
          set +o pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ -d "$GITHUB_WORKSPACE/.ci-cache/android-sdk/system-images" ]; then
            cp -a "$GITHUB_WORKSPACE/.ci-cache/android-sdk/." "$ANDROID_HOME/" 2>/dev/null
            echo "已从缓存恢复 SDK：$(du -sh "$GITHUB_WORKSPACE/.ci-cache/android-sdk" 2>/dev/null | cut -f1)"
          else
            echo "无 SDK 缓存，稍后从网络安装"
          fi
          rm -rf "$GITHUB_WORKSPACE/.ci-cache/android-sdk" 2>/dev/null
          exit 0

      - name: Restore AVD and emulator snapshot
        if: ${{ inputs.emulator != '' }}
        uses: actions/cache@v4
        with:
          path: .ci-cache/avd
          key: br-emu-avd-${{ runner.os }}-${{ steps.scope.outputs.emu }}

      - name: Install AVD into place
        if: ${{ inputs.emulator != '' }}
        shell: bash
        run: |
          set +e
          set +o pipefail
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          if [ -d "$GITHUB_WORKSPACE/.ci-cache/avd" ]; then
            cp -a "$GITHUB_WORKSPACE/.ci-cache/avd/." "$ANDROID_AVD_HOME/" 2>/dev/null
            echo "已从缓存恢复 AVD"
            ls "$ANDROID_AVD_HOME" 2>&1 | head -5
          fi
          rm -rf "$GITHUB_WORKSPACE/.ci-cache/avd" 2>/dev/null
          exit 0

      - name: Install Android debug keystore
        shell: bash
        run: |
          set +e
          set +o pipefail
          mkdir -p "$HOME/.android"
          # A stable debug signing identity: prefer the engine repo's checked-in
          # copy, then the target's own. Without one, Gradle generates a random
          # key per run and updates fail with a signature mismatch.
          for candidate in "$GITHUB_WORKSPACE/engine/android/debug.keystore" \
                           "$GITHUB_WORKSPACE/work/android/debug.keystore" \
                           "$GITHUB_WORKSPACE/work/debug.keystore"; do
            if [ -f "$candidate" ]; then
              cp -f "$candidate" "$HOME/.android/debug.keystore"
              echo "已安装 $candidate"
              break
            fi
          done
          [ -f "$HOME/.android/debug.keystore" ] || echo "::warning::没有固定 keystore，签名可能在每次会话间变化"
          exit 0

      # Boot an Android emulator, so the agent can install and exercise the app
      # instead of only compiling it.
      #
      # Every step here is load-bearing and was found the hard way:
      #   - `sudo chmod 666 /dev/kvm`: the runner user is NOT in the `kvm` group,
      #     so /dev/kvm (root:kvm 660) is denied. Without this the emulator falls
      #     back to software rendering and never finishes booting.
      #   - install `emulator` AND the system image together: a fresh VM per job
      #     means nothing survives from a previous run.
      #   - `printf 'y...'` instead of `yes |`: `yes` dies of SIGPIPE and
      #     sdkmanager then *silently* reports success without installing.
      #   - wait for `sys.boot_completed`, not just for the device to appear.
      #
      # MEASURED end to end on ubuntu-latest: install 37s, AVD 1s, boot 39s,
      # screencap 1s — about 80s total.
      - name: Start emulator
        id: emulator
        if: ${{ inputs.emulator != '' }}
        shell: bash
        env:
          IN_EMULATOR: ${{ inputs.emulator }}
        run: |
          set +e
          set +o pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          export PATH="$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator"

          api=$(printf '%s' "$IN_EMULATOR" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).api||34)}catch(e){console.log(34)}})")
          arch=$(printf '%s' "$IN_EMULATOR" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).arch||'x86_64')}catch(e){console.log('x86_64')}})")
          profile=$(printf '%s' "$IN_EMULATOR" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).profile||'pixel_7')}catch(e){console.log('pixel_7')}})")
          image=$(printf '%s' "$IN_EMULATOR" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).image||'google_apis')}catch(e){console.log('google_apis')}})")

          pkg="system-images;android-${api};${image};${arch}"
          echo "emulator package: $pkg  profile: $profile"

          # Did the SDK come from cache? Decides whether it needs re-staging.
          sdk_restored=0
          [ -d "$ANDROID_HOME/system-images/android-${api}/${image}/${arch}" ] && [ -x "$ANDROID_HOME/emulator/emulator" ] && sdk_restored=1
          echo "SDK 已就位（来自缓存）：$sdk_restored"

          # Hardware acceleration. Without the group fix this is denied and the
          # emulator silently degrades to unusably slow software rendering.
          sudo -n chmod 666 /dev/kvm 2>/dev/null || true
          echo "kvm: $(ls -l /dev/kvm 2>&1)"

          t0=$(date +%s)
          if [ "$sdk_restored" = "1" ]; then
            echo "install=0s（已由缓存提供，跳过下载）"
          else
            ( printf 'y\n%.0s' $(seq 1 50) ) | sdkmanager --install "emulator" "$pkg" > /tmp/emu-install.log 2>&1
            echo "install=$(( $(date +%s) - t0 ))s"
          fi

          if [ ! -x "$ANDROID_HOME/emulator/emulator" ]; then
            echo "::error::emulator 安装失败"; tail -20 /tmp/emu-install.log; exit 1
          fi
          if [ ! -d "$ANDROID_HOME/system-images/android-${api}/${image}/${arch}" ]; then
            echo "::error::系统镜像安装失败：$pkg"; tail -20 /tmp/emu-install.log; exit 1
          fi

          "$ANDROID_HOME/emulator/emulator" -accel-check 2>&1 | tail -3

          mkdir -p "$ANDROID_AVD_HOME"
          snapshot_existed=0
          [ -d "$ANDROID_AVD_HOME/ci.avd/snapshots" ] && snapshot_existed=1

          # NEVER recreate an AVD that came from the cache: `--force` would wipe
          # the saved snapshot, which is the entire reason we cache the AVD dir.
          if [ -d "$ANDROID_AVD_HOME/ci.avd" ]; then
            echo "复用缓存中的 AVD（快照：$snapshot_existed）"
          else
            echo no | avdmanager create avd -n ci -k "$pkg" -d "$profile" --force > /tmp/avd.log 2>&1
            if ! "$ANDROID_HOME/emulator/emulator" -list-avds | grep -qx ci; then
              echo "::error::AVD 创建失败"; tail -20 /tmp/avd.log; exit 1
            fi
            echo "AVD 已创建：$profile / API $api"
          fi

          t1=$(date +%s)
          # Boot WITH snapshots when one was restored: quickboot resumes a booted
          # system in seconds instead of repeating the whole boot sequence. On a
          # cold cache, skip snapshots so a half-written one cannot wedge startup.
          boot_flags="-no-window -no-audio -no-boot-anim -gpu swiftshader_indirect"
          if [ "$snapshot_existed" = "1" ]; then
            echo "尝试从快照恢复…"
            boot_flags="$boot_flags -snapshot ci_snap"
          else
            boot_flags="$boot_flags -no-snapshot"
          fi
          nohup "$ANDROID_HOME/emulator/emulator" -avd ci $boot_flags \
            > /tmp/emulator.log 2>&1 &

          adb start-server > /dev/null 2>&1
          for i in $(seq 1 90); do
            adb devices 2>/dev/null | grep -q emulator && break
            sleep 2
          done
          for i in $(seq 1 120); do
            b=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            [ "$b" = "1" ] && break
            sleep 2
          done
          echo "boot=$(( $(date +%s) - t1 ))s"
          adb devices
          adb shell wm size 2>&1

          if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" != "1" ]; then
            echo "::error::模拟器未完成启动"
            grep -iE "error|fail" /tmp/emulator.log | head -12
            exit 1
          fi

          # Save a snapshot for the NEXT session. This is what makes a later
          # session resume in seconds rather than cold-booting.
          if [ "$snapshot_existed" != "1" ]; then
            echo "保存快照供下次使用…"
            adb emu avd snapshot save ci_snap 2>&1 | head -3
            ls -la "$ANDROID_AVD_HOME/ci.avd/snapshots" 2>/dev/null | head -5
          fi

          # Stage the cacheable bits for `actions/cache` to store at job end.
          # The AVD is always staged (it may hold a fresh snapshot); the SDK is
          # staged only when it was installed this run, otherwise it came from
          # cache and re-saving it would be pointless churn.
          mkdir -p "$GITHUB_WORKSPACE/.ci-cache"
          cp -a "$ANDROID_AVD_HOME" "$GITHUB_WORKSPACE/.ci-cache/avd" 2>/dev/null
          if [ ! -d "$ANDROID_HOME/system-images" ] || [ "$sdk_restored" != "1" ]; then
            mkdir -p "$GITHUB_WORKSPACE/.ci-cache/android-sdk"
            cp -a "$ANDROID_HOME/system-images" "$GITHUB_WORKSPACE/.ci-cache/android-sdk/" 2>/dev/null
            cp -a "$ANDROID_HOME/emulator" "$GITHUB_WORKSPACE/.ci-cache/android-sdk/" 2>/dev/null
          fi
          echo "缓存暂存：$(du -sh "$GITHUB_WORKSPACE/.ci-cache" 2>/dev/null | cut -f1)"

          # Report what is worth saving so the save steps below can run right now
          # instead of waiting for the job to end. A session can stay alive for
          # hours, and `actions/cache` only saves in a post-job step — which meant
          # a long session never populated the cache at all.
          echo "fresh_sdk=$([ "$sdk_restored" = '1' ] && echo 0 || echo 1)" >> "$GITHUB_OUTPUT"
          echo "fresh_avd=$([ "$snapshot_existed" = '1' ] && echo 0 || echo 1)" >> "$GITHUB_OUTPUT"

          echo "::notice::模拟器就绪（API $api / $profile）"
          exit 0

      # Save immediately, not at job end. Without this a session that stays alive
      # for hours never writes its cache, so the next session starts cold again.
      - name: Save Android SDK cache now
        if: ${{ inputs.emulator != '' && steps.emulator.outputs.fresh_sdk == '1' }}
        uses: actions/cache/save@v4
        with:
          path: .ci-cache/android-sdk
          key: br-emu-sdk-${{ runner.os }}-${{ steps.scope.outputs.emu }}

      - name: Save AVD snapshot cache now
        if: ${{ inputs.emulator != '' && steps.emulator.outputs.fresh_avd == '1' }}
        uses: actions/cache/save@v4
        with:
          path: .ci-cache/avd
          key: br-emu-avd-${{ runner.os }}-${{ steps.scope.outputs.emu }}

      - name: Gradle tuning
        shell: bash
        run: |
          set +e
          set +o pipefail
          props="$HOME/.gradle/gradle.properties"
          mkdir -p "$(dirname "$props")"
          {
            echo '# injected by build-runner session'
            echo 'org.gradle.caching=true'
            # A single daemon for the whole session: every command after the first
            # compiles incrementally instead of from scratch.
            echo 'org.gradle.daemon=true'
            echo 'org.gradle.parallel=true'
            echo 'org.gradle.configuration-cache=true'
            echo 'org.gradle.configuration-cache.problems=warn'
          } > "$props"
          cat "$props"
          exit 0

      - name: Apply workspace patch
        if: ${{ inputs.patch_ref != '' || inputs.workspace_patch != '' }}
        shell: bash
        working-directory: work
        env:
          IN_PATCH: ${{ inputs.workspace_patch }}
          IN_REF: ${{ inputs.patch_ref }}
        run: |
          set +e
          set +o pipefail
          if [ -n "${IN_REF:-}" ]; then
            url="https://raw.githubusercontent.com/${{ github.repository }}/${IN_REF}/.build-runner/workspace.patch"
            curl -fsSL "$url" -o /tmp/br.patch.raw || { echo "::error::补丁获取失败"; exit 1; }
            head -c 5 /tmp/br.patch.raw | grep -q '^diff ' && cp /tmp/br.patch.raw /tmp/br.patch \
              || base64 -d < /tmp/br.patch.raw > /tmp/br.patch
          elif [ -n "${IN_PATCH:-}" ]; then
            printf '%s' "$IN_PATCH" | base64 -d > /tmp/br.patch
          fi
          if [ -s /tmp/br.patch ]; then
            git apply --binary --whitespace=nowarn /tmp/br.patch \
              || git apply --binary --whitespace=nowarn -3 /tmp/br.patch \
              || { echo "::error::补丁应用失败"; exit 1; }
            echo "已应用本地改动补丁"
          fi
          exit 0

      - name: Setup commands
        if: ${{ inputs.setup != '' }}
        shell: bash
        working-directory: work
        env:
          IN_SETUP: ${{ inputs.setup }}
          IN_SHELL: ${{ inputs.shell }}
        run: |
          set -euo pipefail
          case "${IN_SHELL:-bash}" in
            pwsh|powershell) ext=ps1 ;;
            python)          ext=py  ;;
            *)               ext=sh  ;;
          esac
          printf '%s\n' "$IN_SETUP" > "/tmp/br-setup.$ext"
          case "${IN_SHELL:-bash}" in
            pwsh|powershell) pwsh -NoProfile -File "/tmp/br-setup.ps1" ;;
            python)          python3 "/tmp/br-setup.py" 2>/dev/null || python "/tmp/br-setup.py" ;;
            *)               bash "/tmp/br-setup.sh" ;;
          esac

      # The loop runs in the target checkout, inside this same job, so the daemon,
      # incremental state and working tree all survive between commands.
      - name: Serve commands
        shell: bash
        working-directory: work
        env:
          GH_TOKEN: ${{ secrets.session_token || github.token }}
          SESSION_REPO: ${{ github.repository }}
          SESSION_ISSUE: ${{ inputs.issue }}
          SESSION_SHELL: ${{ inputs.shell }}
          SESSION_IDLE_SECONDS: ${{ inputs.idle_seconds }}
          SESSION_POLL_SECONDS: '3'
        run: |
          node "$GITHUB_WORKSPACE/engine/session-runner.mjs"
